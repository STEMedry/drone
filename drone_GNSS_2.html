<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D GNSS Positioning Simulation</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --panel:#ffffff;
      --border:#d8e2ee;
      --text:#1d2835;
      --muted:#5d6f84;
      --blue:#2563eb;
      --green:#1f9d3a;
      --orange:#d78500;
      --red:#c6342f;
      --teal:#0f766e;
      --purple:#6d28d9;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      padding:10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }
    .error{
      width:100%;
      max-width:1360px;
      display:none;
      border:1px solid #ffb8b8;
      background:#ffe9e9;
      color:#8e1010;
      border-radius:8px;
      padding:10px;
      white-space:pre-wrap;
      font-size:13px;
    }
    .header{
      width:100%;
      max-width:1360px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    h1{ margin:0; font-size:24px; line-height:1.2; }
    .header-actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .header-btn{
      border:none; border-radius:8px; padding:8px 12px; color:#fff; font-weight:700;
      cursor:pointer; font-size:13px; white-space:nowrap; background:var(--blue);
    }
    .header-btn:hover{ background:#1d4ed8; }
    .tutorial-btn{ background:var(--orange); }
    .tutorial-btn:hover{ background:#b86f00; }
    .lang-btn{ background:var(--green); }
    .lang-btn:hover{ background:#187d2f; }

    .app{
      width:100%;
      max-width:1360px;
      min-height:680px;
      display:flex;
      gap:10px;
    }
    .left{
      flex:2.2;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .right{
      flex:1.2;
      min-width:340px;
      height:680px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:0;
    }

    .viz{
      position:relative;
      border:1px solid var(--border);
      border-radius:10px;
      background:#040b18;
      height:680px;
      overflow:hidden;
    }
    #threeContainer{ width:100%; height:100%; display:block; }
    #threeContainer canvas{ width:100% !important; height:100% !important; display:block; }

    .canvas-btn{
      position:absolute;
      top:10px;
      right:10px;
      z-index:30;
      border:none;
      border-radius:8px;
      padding:7px 11px;
      min-height:0;
      cursor:pointer;
      font-size:12px;
      font-weight:800;
      color:#fff;
      background:#1f9d3a;
      box-shadow:0 3px 10px rgba(0,0,0,0.32);
    }
    .canvas-btn:hover{ background:#187d2f; }

    .canvas-loading{
      position:absolute;
      inset:0;
      z-index:25;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#ffffff;
      font-weight:800;
      font-size:24px;
      letter-spacing:0.4px;
      background:rgba(0,0,0,0.38);
      pointer-events:none;
      text-shadow:0 2px 8px rgba(0,0,0,0.55);
    }

    .canvas-footnote{
      position:absolute;
      left:12px;
      bottom:10px;
      z-index:20;
      color:#ffffff;
      font-size:14px;
      font-weight:800;
      letter-spacing:0.3px;
      text-shadow:0 2px 8px rgba(0,0,0,0.6);
      user-select:none;
      pointer-events:none;
    }

    .card{
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--panel);
      padding:10px;
      flex:0 0 auto;
    }

    .card-title{
      font-size:13px;
      font-weight:800;
      color:#31465f;
      margin:0 0 8px 0;
      letter-spacing:0.2px;
    }

    .controls{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:6px;
      padding:8px;
    }
    button{
      border:none;
      border-radius:8px;
      padding:6px 8px;
      min-height:30px;
      color:#fff;
      font-weight:700;
      cursor:pointer;
      font-size:12px;
      line-height:1.1;
    }
    button:disabled{ opacity:0.55; cursor:not-allowed; }
    .btn-blue{ background:var(--blue); }
    .btn-blue:hover{ background:#1d4ed8; }
    .btn-green{ background:var(--green); }
    .btn-green:hover{ background:#187d2f; }
    .btn-orange{ background:var(--orange); }
    .btn-orange:hover{ background:#b86f00; }
    .btn-red{ background:var(--red); }
    .btn-red:hover{ background:#a82723; }
    .btn-teal{ background:var(--teal); }
    .btn-teal:hover{ background:#0b5e58; }
    .btn-purple{ background:var(--purple); }
    .btn-purple:hover{ background:#5b21b6; }

    .field{
      display:grid;
      grid-template-columns:150px 1fr 68px;
      gap:8px;
      align-items:center;
      margin-bottom:8px;
      font-size:13px;
    }
    .field:last-child{ margin-bottom:0; }
    .field input[type="range"]{ width:100%; }

    .value{
      text-align:center;
      border:1px solid var(--border);
      border-radius:6px;
      padding:4px 6px;
      background:#f8fafc;
      font-weight:700;
      font-size:12px;
    }

    .status-grid-3{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
    }
    .status-box{
      border:1px solid var(--border);
      border-radius:8px;
      padding:6px;
      background:#f8fbff;
      text-align:center;
    }
    .status-k{
      font-size:11px;
      color:#42566d;
      margin-bottom:4px;
      line-height:1.1;
    }
    .status-v{
      font-size:16px;
      font-weight:800;
      margin-top:2px;
      line-height:1.1;
    }
    .conf-low{ color:#c6342f; }
    .conf-mid{ color:#1d4ed8; }
    .conf-high{ color:#1f9d3a; }

    .table-wrap{
      border:1px solid var(--border);
      border-radius:10px;
      overflow:auto;
      background:#fff;
      flex:1 1 auto;
      min-height:0;
      max-height:none;
    }
    table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:11px;
    }
    th,td{
      border:1px solid #e6edf4;
      padding:4px 5px;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    th{ background:#f3f7fb; position:sticky; top:0; z-index:1; }

    .sat-id-btn{
      border:none;
      border-radius:6px;
      padding:3px 6px;
      min-height:0;
      background:#e7eefc;
      color:#1d4ed8;
      font-weight:800;
      cursor:pointer;
      font-size:11px;
    }
    .sat-id-btn.active{
      background:#1d4ed8;
      color:#fff;
    }

    .sphere-btn{
      border:none;
      border-radius:6px;
      padding:3px 6px;
      min-height:0;
      cursor:pointer;
      font-size:11px;
      font-weight:800;
      color:#fff;
      background:#64748b;
    }
    .sphere-btn.on{ background:#7c3aed; }
    .sphere-btn.off{ background:#64748b; }
    .sphere-btn:disabled{
      opacity:0.45;
      cursor:not-allowed;
    }

    .ok{ background:#e8f9e8; color:#1f7d34; font-weight:700; }
    .bad{ background:#fff1f1; color:#9e2323; font-weight:700; }
    .mid{ background:#f2f6ff; color:#1d4ed8; font-weight:700; }

    .tutorial-backdrop{
      position:fixed;
      inset:0;
      background:rgba(10,15,25,0.52);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:14px;
    }
    .tutorial-card{
      width:100%;
      max-width:760px;
      max-height:88vh;
      overflow:auto;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      padding:14px;
    }
    .tutorial-title{ margin:0 0 8px 0; font-size:20px; line-height:1.3; }
    .tutorial-sub{ margin:0 0 10px 0; color:var(--muted); font-size:13px; line-height:1.4; }
    .tutorial-sections{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .tutorial-section{
      border:1px solid #e3ebf5;
      border-radius:10px;
      background:#f9fbfe;
      padding:10px;
    }
    .tutorial-section h3{
      margin:0 0 8px 0;
      font-size:15px;
      color:#23364c;
    }
    .tutorial-list{
      margin:0;
      padding-left:18px;
      font-size:14px;
      line-height:1.55;
    }

    .tutorial-actions{ margin-top:12px; display:flex; justify-content:flex-end; }
    .tutorial-close{
      background:var(--blue);
      color:#fff;
      border:none;
      border-radius:8px;
      padding:8px 12px;
      font-weight:700;
      cursor:pointer;
      min-height:0;
    }
    .tutorial-close:hover{ background:#1d4ed8; }

    @media (max-width:1024px){
      .app{ flex-direction:column; }
      .right{ min-width:0; height:auto; }
      .viz{ height:500px; }
      .field{ grid-template-columns:120px 1fr 58px; }
      h1{ font-size:20px; }
      .controls{ grid-template-columns:repeat(2,minmax(0,1fr)); }
      .status-grid-3{ grid-template-columns:1fr; }
      .table-wrap{ max-height:360px; flex:0 0 auto; }
      .canvas-loading{ font-size:20px; }
    }
  </style>
</head>
<body>
  <div id="errorBox" class="error"></div>

  <div class="header">
    <div>
      <h1 id="titleMain">3D GNSS Positioning Simulation</h1>
    </div>
    <div class="header-actions">
      <button id="sim2dBtn" class="header-btn">Simplified 2D simulation</button>
      <button id="tutorialBtn" class="header-btn tutorial-btn">Tutorial</button>
      <button id="langBtn" class="header-btn lang-btn">中文</button>
    </div>
  </div>

  <div class="app">
    <section class="left">
      <div class="viz">
        <div id="threeContainer"></div>
        <div id="loadingOverlay" class="canvas-loading">Loading ...</div>
        <button id="soundToggleBtn" class="canvas-btn">Sound Off</button>
        <div class="canvas-footnote">C Y YEUNG, EdUHK</div>
      </div>
    </section>

    <aside class="right">
      <div class="card controls">
        <button id="satPauseBtn" class="btn-orange">Pause Satellite</button>
        <button id="autoDroneBtn" class="btn-blue">Drone Move</button>
        <button id="showSpheresBtn" class="btn-purple">Effective Spheres: OFF</button>
        <button id="connectionsBtn" class="btn-teal">Connections: OFF</button>
        <button id="resetBtn" class="btn-red">Reset</button>
      </div>

      <div class="card">
        <div id="droneLocationTitle" class="card-title">Drone Location</div>
        <div class="field">
          <label id="latLabel" for="latSlider">Latitude (°)</label>
          <input id="latSlider" type="range" min="-85" max="85" step="0.1" value="22.3" />
          <span id="latValue" class="value">22.3</span>
        </div>
        <div class="field">
          <label id="lonLabel" for="lonSlider">Longitude (°)</label>
          <input id="lonSlider" type="range" min="-180" max="180" step="0.1" value="114.2" />
          <span id="lonValue" class="value">114.2</span>
        </div>
        <div class="field">
          <label id="altLabel" for="altSlider">Altitude</label>
          <input id="altSlider" type="range" min="0.2" max="5.0" step="0.1" value="1.2" />
          <span id="altValue" class="value">1.2</span>
        </div>
      </div>

      <div class="card">
        <div class="status-grid-3">
          <div class="status-box">
            <div id="selectedK" class="status-k">Selected Satellites</div>
            <div id="selectedCount" class="status-v">0</div>
          </div>
          <div class="status-box">
            <div id="possibleK" class="status-k">Possible Positions</div>
            <div id="possibleCount" class="status-v">0</div>
          </div>
          <div class="status-box">
            <div id="confK" class="status-k">Confidence</div>
            <div id="confidenceText" class="status-v">--</div>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th id="thSat">Satellite</th>
              <th id="thUse">Connected</th>
              <th id="thActive">Active Sphere?</th>
              <th id="thRange">Measured Distance</th>
            </tr>
          </thead>
          <tbody id="satTableBody"></tbody>
        </table>
      </div>
    </aside>
  </div>

  <div id="tutorialBackdrop" class="tutorial-backdrop">
    <div class="tutorial-card">
      <h2 id="tutorialTitle" class="tutorial-title">Tutorial</h2>
      <p id="tutorialSub" class="tutorial-sub">Quick guide for students</p>
      <div id="tutorialSections" class="tutorial-sections"></div>
      <div class="tutorial-actions">
        <button id="tutorialCloseBtn" class="tutorial-close">Close</button>
      </div>
    </div>
  </div>

  <script>
    (function bootstrap() {
      const errorBox = document.getElementById('errorBox');
      const loadingOverlay = document.getElementById('loadingOverlay');

      function showError(msg) {
        errorBox.style.display = 'block';
        errorBox.textContent =
          'Could not load required 3D libraries.\n' +
          msg +
          '\n\nIf sandbox blocks CDN files, run this HTML in a local browser.';
        if (loadingOverlay) {
          loadingOverlay.textContent = 'Loading failed. Please check CDN/network.';
        }
      }
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.async = true;
          s.onload = () => resolve(src);
          s.onerror = () => reject(new Error('Failed: ' + src));
          document.head.appendChild(s);
        });
      }
      async function loadWithFallback(urls) {
        let lastErr = null;
        for (const u of urls) {
          try { await loadScript(u); return; }
          catch (e) { lastErr = e; }
        }
        throw lastErr || new Error('All CDNs failed.');
      }
      async function loadThree() {
        await loadWithFallback([
          'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
          'https://unpkg.com/three@0.128.0/build/three.min.js'
        ]);
        if (!window.THREE) throw new Error('THREE failed to initialize');
        await loadWithFallback([
          'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js',
          'https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js'
        ]);
        if (!window.THREE.OrbitControls) throw new Error('OrbitControls failed to initialize');
      }
      loadThree().then(() => initApp(window.THREE)).catch(e => showError(String(e)));
    })();

    function initApp(THREE) {
      const EARTH_RADIUS = 20;
      const EFFECTIVE_RADIUS = 72;
      const EARTH_TILT_DEG = 23.44;
      const EARTH_ROT_SPEED = 0.028;

      const ORBIT_COUNTS = { MEO: 84, GEO: 30, IGSO: 30 };
      const SAT_COUNT = ORBIT_COUNTS.MEO + ORBIT_COUNTS.GEO + ORBIT_COUNTS.IGSO;

      const MIN_SOLVE_SATS = 4;
      const MAX_SOLVE_SATS = 12;
      const POSSIBLE_MAX_POINTS = 260;

      let satellitesPaused = false;
      let autoDrone = false;
      let showAllSpheres = false;
      let showConnections = false;
      let activeSatIds = new Set();
      let manualSphereSatIds = new Set();
      let lang = 'en';

      const i18n = {
        en: {
          titleMain: '3D GNSS Positioning Simulation',
          sim2d: 'Simplified 2D simulation',
          tutorialBtn: 'Tutorial',
          tutorialTitle: 'Student Tutorial: How to Read This 3D GNSS Simulation',
          tutorialSub: 'Use this as a learning lab to connect geometry with positioning accuracy.',
          tutorialSections: [
            {
              title: 'A. Concept Focus: Satellites, Orbits, and Coverage',
              items: [
                'Watch for 10–15 seconds first: satellites orbit while Earth rotates. This builds 3D spatial intuition.',
                'MEO satellites provide broad global geometry, GEO satellites keep stable regional visibility, and IGSO satellites add inclined paths that improve geometry over time.',
                'Compare orbit tags (MEO/GEO/IGSO) in the table and observe how each orbit family contributes to line-of-sight availability.'
              ]
            },
            {
              title: 'B. Operational Focus: How to Use the Simulation',
              items: [
                'Set Latitude, Longitude, and Altitude in Drone Location to define the drone’s true position.',
                'Click satellite IDs to connect selected satellites. This models choosing trusted measurements.',
                'Use “Active Sphere” and “Connections” to visualize range geometry and line-of-sight relationships.',
                'Use “Drone Move” to observe how dynamic geometry changes the solution in real time.'
              ]
            },
            {
              title: 'C. Data Interpretation Focus: Confidence and Possible Positions',
              items: [
                'Possible Positions indicates ambiguity: many points = weak constraint, fewer points = stronger constraint, one point = unique fix.',
                'Confidence colour mapping: Low = red, Medium = blue, High = green.',
                'Learning task: compare poor geometry (clustered satellites) vs. strong geometry (well-distributed satellites), then reset and test another location.'
              ]
            }
          ],
          tutorialClose: 'Close',
          langBtn: '中文',
          pauseSat: 'Pause Satellite',
          resumeSat: 'Resume Satellite',
          autoOn: 'Drone Move',
          autoOff: 'Stop Drone Move',
          showSpheres: 'Effective Spheres: ',
          connections: 'Connections: ',
          on: 'ON',
          off: 'OFF',
          reset: 'Reset',
          droneLocation: 'Drone Location',
          lat: 'Latitude (°)',
          lon: 'Longitude (°)',
          alt: 'Altitude',
          selectedK: 'Selected Satellites',
          possibleK: 'Possible Positions',
          confK: 'Confidence',
          thSat: 'Satellite',
          thUse: 'Connected',
          thActive: 'Active Sphere?',
          thRange: 'Measured Distance',
          yes: 'Yes',
          no: 'No',
          confHigh: 'High',
          confMid: 'Medium',
          confLow: 'Low',
          soundOff: 'Sound Off',
          soundOn: 'Sound On',
          loading: 'Loading ...'
        },
        zh: {
          titleMain: '3D GNSS 定位模擬',
          sim2d: '簡化 2D 模擬',
          tutorialBtn: '教學',
          tutorialTitle: '學生教學：如何閱讀這個 3D GNSS 模擬',
          tutorialSub: '把它當成學習實驗室，連結空間幾何與定位準確度。',
          tutorialSections: [
            {
              title: 'A. 概念重點：衛星、軌道與覆蓋',
              items: [
                '先觀察 10–15 秒：衛星繞行、地球自轉，建立三維空間直覺。',
                'MEO 提供主要全球幾何；GEO 在相近經度上空維持穩定區域覆蓋；IGSO 以傾斜軌道補強幾何變化。',
                '比較表格中的軌道標籤（MEO/GEO/IGSO），觀察不同軌道類型對可視覆蓋的影響。'
              ]
            },
            {
              title: 'B. 操作重點：如何進行模擬',
              items: [
                '在「無人機位置」設定緯度、經度與高度，作為真實位置。',
                '在表格點選衛星編號以建立連接，模擬接收機採用的量測來源。',
                '使用「Active Sphere」與「Connections」觀察距離球與視線幾何。',
                '啟用「無人機移動」觀察動態場景下定位幾何的即時變化。'
              ]
            },
            {
              title: 'C. 判讀重點：可靠度與可能位置',
              items: [
                '「可能位置」點越多代表歧義越大；點越少代表解越收斂；1 點代表唯一解。',
                '可靠度顏色：低（紅色）、中（藍色）、高（綠色）。',
                '學習任務：比較「衛星分布集中」與「衛星分布分散」兩種情況，再重設到不同位置驗證假設。'
              ]
            }
          ],
          tutorialClose: '關閉',
          langBtn: 'EN',
          pauseSat: '暫停衛星',
          resumeSat: '繼續衛星',
          autoOn: '無人機移動',
          autoOff: '停止無人機移動',
          showSpheres: '有效球體：',
          connections: '連線：',
          on: '開',
          off: '關',
          reset: '重設',
          droneLocation: '無人機位置',
          lat: '緯度 (°)',
          lon: '經度 (°)',
          alt: '高度',
          selectedK: '已選衛星',
          possibleK: '可能位置',
          confK: '可靠度',
          thSat: '衛星',
          thUse: '已連接',
          thActive: '啟用球體？',
          thRange: '量測距離',
          yes: '是',
          no: '否',
          confHigh: '高',
          confMid: '中',
          confLow: '低',
          soundOff: '關閉聲音',
          soundOn: '開啟聲音',
          loading: '載入中 ...'
        }
      };

      const droneState = { latDeg: 22.3, lonDeg: 114.2, alt: 1.2 };

      const ui = {
        titleMain: document.getElementById('titleMain'),
        sim2dBtn: document.getElementById('sim2dBtn'),
        tutorialBtn: document.getElementById('tutorialBtn'),
        langBtn: document.getElementById('langBtn'),
        soundToggleBtn: document.getElementById('soundToggleBtn'),
        loadingOverlay: document.getElementById('loadingOverlay'),
        satPauseBtn: document.getElementById('satPauseBtn'),
        autoDroneBtn: document.getElementById('autoDroneBtn'),
        showSpheresBtn: document.getElementById('showSpheresBtn'),
        connectionsBtn: document.getElementById('connectionsBtn'),
        resetBtn: document.getElementById('resetBtn'),
        droneLocationTitle: document.getElementById('droneLocationTitle'),
        latLabel: document.getElementById('latLabel'),
        lonLabel: document.getElementById('lonLabel'),
        altLabel: document.getElementById('altLabel'),

      function geodeticToCartesian(latDeg, lonDeg, radius){
        const lat = degToRad(latDeg);
        const lon = degToRad(lonDeg);
        const cosLat = Math.cos(lat);
        return new THREE.Vector3(
          radius * cosLat * Math.cos(lon),
          radius * Math.sin(lat),
          radius * cosLat * Math.sin(lon)
        );
      }

      function hasLineOfSight(pointA, pointB, earthRadius){
        const ab = new THREE.Vector3().subVectors(pointB, pointA);
        const abLenSq = ab.lengthSq();
        if (abLenSq < 1e-10) return false;
        const t0 = clamp(-pointA.dot(ab) / abLenSq, 0, 1);
        const closest = new THREE.Vector3().copy(pointA).addScaledVector(ab, t0);
        return closest.length() > earthRadius + 0.02;
      }

      function transpose(A){
        const rows = A.length, cols = A[0].length;
        const T = new Array(cols);
        for (let c = 0; c < cols; c++){
          T[c] = new Array(rows);
          for (let r = 0; r < rows; r++) T[c][r] = A[r][c];
        }
        return T;
      }
      function matMul(A, B){
        const rA = A.length, cA = A[0].length, cB = B[0].length;
        const R = Array.from({ length: rA }, () => Array(cB).fill(0));
        for (let i = 0; i < rA; i++){
          for (let k = 0; k < cA; k++){
            const aik = A[i][k];
            for (let j = 0; j < cB; j++) R[i][j] += aik * B[k][j];
          }
        }
        return R;
      }
      function matVecMul(A, v){
        const out = Array(A.length).fill(0);
        for (let i = 0; i < A.length; i++){
          let s = 0;
          for (let j = 0; j < A[0].length; j++) s += A[i][j] * v[j];
          out[i] = s;
        }
        return out;
      }
      function invertMatrix(M){
        const n = M.length;
        const A = M.map(row => row.slice());
        const I = Array.from({ length: n }, (_, r) =>
          Array.from({ length: n }, (_, c) => (r === c ? 1 : 0))
        );
        for (let col = 0; col < n; col++){
          let pivot = col;
          let maxAbs = Math.abs(A[col][col]);
          for (let r = col + 1; r < n; r++){
            const v = Math.abs(A[r][col]);
            if (v > maxAbs){ maxAbs = v; pivot = r; }
          }
          if (maxAbs < 1e-12) return null;
          if (pivot !== col){
            [A[col], A[pivot]] = [A[pivot], A[col]];
            [I[col], I[pivot]] = [I[pivot], I[col]];
          }
          const diag = A[col][col];
          for (let j = 0; j < n; j++){ A[col][j] /= diag; I[col][j] /= diag; }
          for (let r = 0; r < n; r++){
            if (r === col) continue;
            const f = A[r][col];
            for (let j = 0; j < n; j++){
              A[r][j] -= f * A[col][j];
              I[r][j] -= f * I[col][j];
            }
          }
        }
        return I;
      }

      function solveTrilateration(selectedSats, initialPos, initialClockBias){
        let x = [initialPos.x, initialPos.y, initialPos.z, initialClockBias];
        let success = false;

        for (let iter = 0; iter < 10; iter++){
          const H = [];
          const v = [];
          for (const s of selectedSats){
            const dx = x[0] - s.pos.x;
            const dy = x[1] - s.pos.y;
            const dz = x[2] - s.pos.z;
            const ri = Math.sqrt(dx*dx + dy*dy + dz*dz);
            if (ri < 1e-9) continue;
            const pred = ri + x[3];
            const res = s.measuredRange - pred;
            H.push([dx/ri, dy/ri, dz/ri, 1]);
            v.push(res);
          }
          if (H.length < 4) break;
          const Ht = transpose(H);
          const HtH = matMul(Ht, H);
          const HtHInv = invertMatrix(HtH);
          if (!HtHInv) break;
          const Htv = matVecMul(Ht, v);
          const delta = matVecMul(HtHInv, Htv);

          x[0] += delta[0];
          x[1] += delta[1];
          x[2] += delta[2];
          x[3] += delta[3];

          const stepSize = Math.sqrt(delta[0]*delta[0] + delta[1]*delta[1] + delta[2]*delta[2]);
          if (stepSize < 1e-4){ success = true; break; }
          if (iter === 9) success = true;
        }

        return { success, estPos: new THREE.Vector3(x[0], x[1], x[2]), clockBias: x[3] };
      }

      function satelliteColor(index, total){
        const hue = (index * 360 / total) % 360;
        const c = new THREE.Color();
        c.setHSL(hue / 360, 0.84, 0.56);
        return c;
      }

      function hash2(x, y){
        const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
        return s - Math.floor(s);
      }
      function smoothNoise(x, y){
        const x0 = Math.floor(x), y0 = Math.floor(y);
        const x1 = x0 + 1, y1 = y0 + 1;
        const sx = x - x0, sy = y - y0;
        const n00 = hash2(x0, y0), n10 = hash2(x1, y0), n01 = hash2(x0, y1), n11 = hash2(x1, y1);
        const ix0 = lerp(n00, n10, sx * sx * (3 - 2 * sx));
        const ix1 = lerp(n01, n11, sx * sx * (3 - 2 * sx));
        return lerp(ix0, ix1, sy * sy * (3 - 2 * sy));
      }
      function fbm(x, y, oct=7){
        let v = 0, a = 0.5, f = 1;
        for (let i = 0; i < oct; i++){ v += a * smoothNoise(x * f, y * f); f *= 2; a *= 0.5; }
        return v;
      }
      function ridge(x, y, oct=6){
        let v = 0, a = 0.55, f = 1;
        for (let i = 0; i < oct; i++){
          const n = smoothNoise(x * f, y * f);
          v += a * (1 - Math.abs(2*n - 1));
          f *= 2.02;
          a *= 0.5;
        }
        return clamp(v, 0, 1);
      }
      function lonDiff(a,b){
        let d = Math.abs(a-b) % 360;
        if (d > 180) d = 360 - d;
        return d;
      }
      function gaussian2(lat, lon, lat0, lon0, sLat, sLon){
        const dLat = (lat-lat0)/sLat;
        const dLon = lonDiff(lon, lon0)/sLon;
        return Math.exp(-(dLat*dLat + dLon*dLon));
      }

          ctx.fill();

      function createNormalFromHeight(heightData, w, h, strength){
        const normal = new Uint8ClampedArray(w * h * 4);
        function hAt(x, y){
          const xx = (x + w) % w;
          const yy = (y + h) % h;
          return heightData[(yy * w + xx) * 4] / 255;
        }
        for (let y = 0; y < h; y++){
          for (let x = 0; x < w; x++){
            const hl = hAt(x - 1, y);
            const hr = hAt(x + 1, y);
            const hd = hAt(x, y - 1);
            const hu = hAt(x, y + 1);
            const dx = (hr - hl) * strength;
            const dy = (hu - hd) * strength;
            let nx = -dx;
            let ny = -dy;
            let nz = 1.0;
            const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
            nx /= len; ny /= len; nz /= len;
            const i = (y * w + x) * 4;
            normal[i] = Math.floor((nx * 0.5 + 0.5) * 255);
            normal[i+1] = Math.floor((ny * 0.5 + 0.5) * 255);
            normal[i+2] = Math.floor((nz * 0.5 + 0.5) * 255);
            normal[i+3] = 255;
          }
        }
        return normal;
      }

      function createEarthTextures(){
        const w = 2048, h = 1024;

        const mapCanvas = document.createElement('canvas'); mapCanvas.width = w; mapCanvas.height = h;
        const mapCtx = mapCanvas.getContext('2d');
        const bumpCanvas = document.createElement('canvas'); bumpCanvas.width = w; bumpCanvas.height = h;
        const bumpCtx = bumpCanvas.getContext('2d');
        const specCanvas = document.createElement('canvas'); specCanvas.width = w; specCanvas.height = h;
        const specCtx = specCanvas.getContext('2d');
        const cloudCanvas = document.createElement('canvas'); cloudCanvas.width = w; cloudCanvas.height = h;
        const cloudCtx = cloudCanvas.getContext('2d');
        const normalCanvas = document.createElement('canvas'); normalCanvas.width = w; normalCanvas.height = h;
        const normalCtx = normalCanvas.getContext('2d');

        // Ocean base gradient
        const oceanGrad = mapCtx.createLinearGradient(0, 0, 0, h);
        oceanGrad.addColorStop(0, '#0b355c');
        oceanGrad.addColorStop(0.32, '#125180');
        oceanGrad.addColorStop(0.66, '#0f4672');
        oceanGrad.addColorStop(1, '#082c4d');
        mapCtx.fillStyle = oceanGrad;
        mapCtx.fillRect(0, 0, w, h);

        // Land mask
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = w; maskCanvas.height = h;
        const maskCtx = maskCanvas.getContext('2d');
        drawContinentMask(maskCtx, w, h);
        const mask = maskCtx.getImageData(0,0,w,h).data;

        const mapImg = mapCtx.getImageData(0,0,w,h);
        const bumpImg = bumpCtx.createImageData(w,h);
        const specImg = specCtx.createImageData(w,h);
        const cloudImg = cloudCtx.createImageData(w,h);

        function isLandAt(px, py){
          const x = (px + w) % w;
          const y = clamp(py, 0, h - 1);
          return mask[(y * w + x) * 4 + 3] > 10;
        }

        function nearCoast(px, py){
          if (isLandAt(px, py)) return false;
          for (let dy = -2; dy <= 2; dy++){
            for (let dx = -2; dx <= 2; dx++){
              if (isLandAt(px + dx, py + dy)) return true;
            }
          }
          return false;
        }

        for (let y = 0; y < h; y++){
          const lat = 90 - (y / h) * 180;
          const latAbs = Math.abs(lat) / 90;

          for (let x = 0; x < w; x++){
            const i = (y * w + x) * 4;
            const lon = (x / w) * 360 - 180;
            const nx = x / w, ny = y / h;
            const isLand = mask[i + 3] > 10;

            // Noise fields
            const nBase = fbm(nx * 2.8, ny * 2.8, 7);
            const nDetail = fbm(nx * 12.5 + 5.1, ny * 12.5 - 3.6, 6);
            const nMicro = fbm(nx * 34.0 - 2.3, ny * 34.0 + 9.4, 5);
            const nMoist = fbm(nx * 5.0 + 13.7, ny * 5.0 - 8.9, 6);
            const rNoise = ridge(nx * 18.0 + 2.1, ny * 18.0 - 1.4, 5);

            let r,g,b,bumpV,specV;

            // Broad mountain chain fields (to improve realism)
            const andes = gaussian2(lat, lon, -20, -72, 22, 8);
            const rockies = gaussian2(lat, lon, 43, -112, 18, 12);
            const himalaya = gaussian2(lat, lon, 30, 85, 8, 16);
            const alps = gaussian2(lat, lon, 46, 10, 4.5, 6);
            const eastAfrica = gaussian2(lat, lon, 7, 36, 10, 7);
            const australiaRange = gaussian2(lat, lon, -27, 147, 12, 8);
            const antarcticRidge = gaussian2(lat, lon, -80, 160, 5, 45);

            const mountainField = clamp(
              0.95*himalaya + 0.85*andes + 0.75*rockies + 0.52*alps + 0.45*eastAfrica + 0.35*australiaRange + 0.4*antarcticRidge
              + 0.35*rNoise, 0, 1
            );

            if (isLand){
              const humidity = clamp(0.55*nMoist + 0.45*(1 - latAbs), 0, 1);
              const desertBand = (latAbs > 0.18 && latAbs < 0.48) ? 1 : 0;
              const desertness = desertBand * (1 - humidity) * (1 - mountainField) * 1.2;
              const snow = (latAbs > 0.74) || (mountainField > 0.62 && latAbs > 0.28);

              if (snow){
                r = 232; g = 238; b = 245;
              } else if (desertness > 0.45){
                r = 194; g = 163; b = 112;
              } else if (mountainField > 0.58){
                r = 122; g = 124; b = 122;
              } else if (humidity > 0.62){
                r = 69; g = 128; b = 74;
              } else {
                r = 102; g = 137; b = 88;
              }

              const relief = Math.floor((nMicro - 0.5) * 54 + (nDetail - 0.5) * 40 + mountainField * 18);
              r = clamp(r + relief, 0, 255);
              g = clamp(g + relief, 0, 255);
              b = clamp(b + relief, 0, 255);

              // coastal greener fringe on land
              let coastLandBoost = 0;
              for (let dy = -1; dy <= 1; dy++){
                for (let dx = -1; dx <= 1; dx++){
                  if (!isLandAt(x + dx, y + dy)) coastLandBoost += 1;
                }
              }
              if (coastLandBoost > 0){
                g = clamp(g + 6, 0, 255);
                b = clamp(b + 2, 0, 255);
              }

              bumpV = clamp(95 + mountainField * 145 + nMicro * 36 + rNoise * 28, 0, 255);
              specV = clamp(12 + (snow ? 18 : 0), 0, 255);
            } else {
              // Ocean depth + shelves
              const abyssNoise = clamp(0.50*nBase + 0.30*nDetail + 0.20*ridge(nx*9.2, ny*9.2, 4), 0, 1);
              const isShelf = nearCoast(x, y);
              const shelfBoost = isShelf ? 0.28 : 0;

              const depth = clamp(0.1 + abyssNoise * 0.95 - shelfBoost, 0, 1);

              // richer ocean colors
              const baseR = 8 + (1 - depth) * 18;
              const baseG = 45 + (1 - depth) * 52;
              const baseB = 88 + (1 - depth) * 82;

              // currents/waves texture
              const current = Math.sin((ny * Math.PI * 18) + nDetail * 6.5 + nx * 12) * 2.8;
              const microWave = (nMicro - 0.5) * 18;

              r = clamp(baseR + current + microWave * 0.4, 0, 255);
              g = clamp(baseG + current + microWave * 0.8, 0, 255);
              b = clamp(baseB + current + microWave, 0, 255);

              // shallow coastal tint
              if (isShelf){
                r = clamp(r + 8, 0, 255);
                g = clamp(g + 18, 0, 255);
                b = clamp(b + 16, 0, 255);
              }

              bumpV = clamp(28 + (1 - depth) * 20 + nDetail * 18 + nMicro * 15, 0, 255);
              specV = clamp(155 + (1 - depth) * 90, 0, 255);
            }

            mapImg.data[i] = r; mapImg.data[i+1] = g; mapImg.data[i+2] = b; mapImg.data[i+3] = 255;
            bumpImg.data[i] = bumpV; bumpImg.data[i+1] = bumpV; bumpImg.data[i+2] = bumpV; bumpImg.data[i+3] = 255;
            specImg.data[i] = specV; specImg.data[i+1] = specV; specImg.data[i+2] = specV; specImg.data[i+3] = 255;

            // Clouds
            const c1 = fbm(nx * 5.3 + 10.7, ny * 5.3 - 6.9, 6);
            const c2 = fbm(nx * 19.0 - 4.2, ny * 19.0 + 2.1, 5);
            const cloudMix = 0.58*c1 + 0.42*c2;
            const cloudAlpha = clamp((cloudMix - 0.56) * 430, 0, 210);
            cloudImg.data[i] = 255;
            cloudImg.data[i+1] = 255;
            cloudImg.data[i+2] = 255;
            cloudImg.data[i+3] = cloudAlpha;
          }
        }

        const normalData = createNormalFromHeight(bumpImg.data, w, h, 4.7);
        const normalImg = normalCtx.createImageData(w, h);
        normalImg.data.set(normalData);

        mapCtx.putImageData(mapImg, 0, 0);
        bumpCtx.putImageData(bumpImg, 0, 0);
        specCtx.putImageData(specImg, 0, 0);
        cloudCtx.putImageData(cloudImg, 0, 0);
        normalCtx.putImageData(normalImg, 0, 0);

        const mapTex = new THREE.CanvasTexture(mapCanvas);
        const bumpTex = new THREE.CanvasTexture(bumpCanvas);
        const specTex = new THREE.CanvasTexture(specCanvas);
        const cloudTex = new THREE.CanvasTexture(cloudCanvas);
        const normalTex = new THREE.CanvasTexture(normalCanvas);

        mapTex.needsUpdate = bumpTex.needsUpdate = specTex.needsUpdate = cloudTex.needsUpdate = normalTex.needsUpdate = true;
        return { mapTex, bumpTex, specTex, cloudTex, normalTex };
      }

      function buildOrbitCatalog() {
        const list = [];
        for (let i = 0; i < ORBIT_COUNTS.MEO; i++) {
          const inclSet = [50,53,56,59,62,65,68];
          const inclination = degToRad(inclSet[i % inclSet.length] + ((i % 3) - 1) * 0.6);
          const altitude = 7.2 + (i % 9) * 0.22 + Math.sin(i * 1.73) * 0.12;
          const raan = degToRad((i * 73 + (i % 5) * 9) % 360);
          const phase = degToRad((i * 137.507764 + (i % 7) * 11) % 360);
          const speed = 0.034 + (i % 6) * 0.0022;
          const direction = (i % 2 === 0) ? 1 : -1;
          list.push({ orbitType: 'MEO', inclination, altitude, raan, phase, speed, direction });
        }
        for (let i = 0; i < ORBIT_COUNTS.GEO; i++) {
          const inclination = degToRad((i % 3) * 0.7);
          const altitude = 12.8 + (i % 5) * 0.06;
          const raan = degToRad((i * 360 / ORBIT_COUNTS.GEO * 1.7) % 360);
          const phase = degToRad((i * 360 / ORBIT_COUNTS.GEO + (i % 6) * 7) % 360);
          const speed = EARTH_ROT_SPEED * (1 + ((i % 4) - 1.5) * 0.002);
          list.push({ orbitType: 'GEO', inclination, altitude, raan, phase, speed, direction: 1 });
        }
        for (let i = 0; i < ORBIT_COUNTS.IGSO; i++) {
          const inclSet = [28,42,55];
          const inclination = degToRad(inclSet[i % inclSet.length] + ((i % 2) ? 0.8 : -0.8));
          const altitude = 12.4 + (i % 6) * 0.07;
          const raan = degToRad((i * 360 / ORBIT_COUNTS.IGSO * 2.3 + (i % 7) * 13) % 360);
          const phase = degToRad((i * 360 / ORBIT_COUNTS.IGSO + (i % 4) * 15) % 360);
          const speed = EARTH_ROT_SPEED * (1 + ((i % 5) - 2) * 0.003);
          list.push({ orbitType: 'IGSO', inclination, altitude, raan, phase, speed, direction: 1 });
        }
        return list;
      }

      function updateSatellitePosition(s, tSec){
        const u = s.phase + s.direction * s.speed * tSec;
        const x1 = s.orbitRadius * Math.cos(u);
        const y1 = s.orbitRadius * Math.sin(u);

        const ci = Math.cos(s.inclination), si = Math.sin(s.inclination);
        const x2 = x1, y2 = y1 * ci, z2 = y1 * si;

        const cO = Math.cos(s.raan), sO = Math.sin(s.raan);
        const x = x2 * cO + z2 * sO;
        const y = y2;
        const z = -x2 * sO + z2 * cO;

        s.pos.set(x,y,z);
        s.model.position.copy(s.pos);
        s.model.lookAt(0,0,0);
      }

      function updateDroneModel(){
        const r = EARTH_RADIUS + droneState.alt;
        const p = geodeticToCartesian(droneState.latDeg, droneState.lonDeg, r);
        trueDroneModel.position.copy(p);
        orientUpToNormal(trueDroneModel, p);
        return p;
      }

      function confidenceFromSolve(activeCount){
        if (activeCount >= 8) return { text: t('confHigh'), level: 'high' };
        if (activeCount >= 4) return { text: t('confMid'), level: 'mid' };
        return { text: t('confLow'), level: 'low' };
      }

      let lastEstPos = new THREE.Vector3(0, 0, EARTH_RADIUS + 2);
      let lastClockBias = 0;
      let measTick = 0;
      let possibleTick = 0;
      let lastPossibleCount = 0;

      function setFixPointVisible(pos, visible){
        fixCore.visible = visible;
        fixGlow.visible = visible;
        if (!visible) return;
        const a = fixCore.geometry.attributes.position.array;
        const b = fixGlow.geometry.attributes.position.array;
        a[0] = pos.x; a[1] = pos.y; a[2] = pos.z;
        b[0] = pos.x; b[1] = pos.y; b[2] = pos.z;
        fixCore.geometry.attributes.position.needsUpdate = true;
        fixGlow.geometry.attributes.position.needsUpdate = true;
      }

      function targetPossibleCountBySatCount(n){
        if (n <= 0) return 0;
        if (n === 1) return 220;
        if (n === 2) return 120;
        if (n === 3) return 45;
        if (n === 4) return 12;
        if (n === 5) return 6;
        if (n === 6) return 4;
        if (n === 7) return 3;
        if (n === 8) return 2;
        return 1;
      }

      function spreadBySatCount(n){
        if (n <= 1) return 8.5;
        if (n === 2) return 5.2;
        if (n === 3) return 2.8;
        if (n === 4) return 1.2;
        if (n === 5) return 0.75;
        if (n === 6) return 0.52;
        if (n === 7) return 0.36;
        if (n === 8) return 0.24;
        return 0.12;
      }

      function fillPossiblePositions(activeUsable, centerPos){
        if (activeUsable.length === 0){
          possibleGeom.setDrawRange(0, 0);
          lastPossibleCount = 0;
          return;
        }

        const n = activeUsable.length;
        const targetCount = Math.min(targetPossibleCountBySatCount(n), POSSIBLE_MAX_POINTS);
        const spreadBase = spreadBySatCount(n);

        if (targetCount <= 1){
          possiblePositionsArray[0] = centerPos.x;
          possiblePositionsArray[1] = centerPos.y;
          possiblePositionsArray[2] = centerPos.z;
          possibleGeom.attributes.position.needsUpdate = true;
          possibleGeom.setDrawRange(0, 1);
          lastPossibleCount = 1;
          return;
        }

        const candidates = [];
        const tries = targetCount * 16;

        for (let i = 0; i < tries; i++){
          const theta = Math.acos(2 * Math.random() - 1);
          const phi = Math.random() * Math.PI * 2;
          const dir = new THREE.Vector3(
            Math.sin(theta) * Math.cos(phi),
            Math.cos(theta),
            Math.sin(theta) * Math.sin(phi)
          );
          const radialJitter = (Math.random() * 2 - 1) * spreadBase;
          const tangentialJitter = (Math.random() * 2 - 1) * spreadBase;

          const p = centerPos.clone().addScaledVector(dir, radialJitter);

          const tangent = new THREE.Vector3().copy(dir).cross(new THREE.Vector3(0.31, 0.86, 0.27));
          if (tangent.lengthSq() > 1e-8){
            tangent.normalize();
            p.addScaledVector(tangent, tangentialJitter * 0.7);
          }

          const rMin = EARTH_RADIUS + 0.2;
          const rMax = EARTH_RADIUS + 5.2;
          const len = p.length();
          if (len < rMin || len > rMax){
            p.normalize().multiplyScalar(clamp(len, rMin, rMax));
          }

          let rms = 0;
          for (let k = 0; k < activeUsable.length; k++){
            const s = activeUsable[k];
            const pred = p.distanceTo(s.pos);
            const e = pred - s.measuredRange;
            rms += e * e;
          }
          rms = Math.sqrt(rms / activeUsable.length);
          candidates.push({ p, rms });
        }

        candidates.sort((a,b)=>a.rms-b.rms);
        const take = Math.min(targetCount, candidates.length, POSSIBLE_MAX_POINTS);

        for (let i = 0; i < take; i++){
          const p = candidates[i].p;
          possiblePositionsArray[i*3 + 0] = p.x;
          possiblePositionsArray[i*3 + 1] = p.y;
          possiblePositionsArray[i*3 + 2] = p.z;
        }
        possibleGeom.attributes.position.needsUpdate = true;
        possibleGeom.setDrawRange(0, take);
        lastPossibleCount = take;
      }

      function updateAll(dronePos, dt, nowMs){
        let usableCount = 0;
        for (const s of satellites){
          s.distance = s.pos.distanceTo(dronePos);
          s.los = hasLineOfSight(s.pos, dronePos, EARTH_RADIUS);
          s.inRange = s.los && s.distance < EFFECTIVE_RADIUS;
          if (s.inRange) usableCount++;
        }

        measTick += dt;
        const refresh = measTick >= 0.5;
        if (refresh) measTick = 0;

        for (const s of satellites){
          if (s.inRange){
            if (refresh || s.measuredRange == null) s.measuredRange = s.pos.distanceTo(dronePos);
          } else {
            s.measuredRange = null;
          }
        }

        const selectedCount = activeSatIds.size;
        const selectedMode = activeSatIds.size > 0;

        const activeUsable = satellites
          .filter(s => activeSatIds.has(s.id) && s.inRange && s.measuredRange != null)
          .slice(0, MAX_SOLVE_SATS);

        const allEffectiveUsable = satellites
          .filter(s => s.inRange && s.measuredRange != null)
          .slice(0, MAX_SOLVE_SATS);

        for (const s of satellites){
          const isSelected = activeSatIds.has(s.id);
          const isEffective = s.inRange;

          const sphereOn = (showAllSpheres || manualSphereSatIds.has(s.id)) &&
                           isEffective &&
                           (!selectedMode || isSelected) &&
                           s.measuredRange != null;

          s.pseudoNest.visible = sphereOn;
          s.sphereLabel.visible = sphereOn;

          if (sphereOn){
            s.pseudoNest.position.copy(s.pos);
            const r = Math.max(0.1, s.measuredRange);
            s.pseudoNest.scale.set(r,r,r);

            const outward = s.pos.clone().normalize().multiplyScalar(1.8);
            s.sphereLabel.position.copy(s.pos).add(outward);
          }

          const lineOn = showConnections && isEffective && (!selectedMode || isSelected);
          s.losLine.visible = lineOn;
          if (lineOn){
            s.losLine.geometry.setFromPoints([s.pos, dronePos]);
            s.losLine.material.color.copy(s.color);
          }

          let targetOpacity = s.los ? (isEffective ? 1 : 0.58) : 0.28;
          if (selectedMode && !isSelected) targetOpacity *= 0.55;

          s.model.traverse(obj => {
            if (obj.isMesh && obj.material){
              obj.material.transparent = true;
              obj.material.opacity = targetOpacity;
            }
          });

          if (s.labelActive && s.labelActive.material){
            s.labelActive.visible = isEffective;
            s.labelActive.material.opacity = isEffective ? 1 : 0;
          }
          if (s.labelInactive && s.labelInactive.material){
            s.labelInactive.visible = !isEffective;
            s.labelInactive.material.opacity = !isEffective ? Math.max(0.5, targetOpacity) : 0;
          }
        }

        let estPos = null;
        let solveOk = false;

        if (activeUsable.length >= MIN_SOLVE_SATS){
          const solve = solveTrilateration(activeUsable, lastEstPos, lastClockBias);
          if (solve.success){
            solveOk = true;
            estPos = solve.estPos.clone();
            lastEstPos.copy(estPos);
            lastClockBias = solve.clockBias;
          }
        }

        const showFix = solveOk && estPos && activeUsable.length >= 4;
        setFixPointVisible(showFix ? estPos : new THREE.Vector3(), !!showFix);

        const possibleSource = autoDrone
          ? allEffectiveUsable
          : (activeSatIds.size > 0 ? activeUsable : allEffectiveUsable);

        possibleTick += dt;
        if (possibleTick >= 0.28){
          possibleTick = 0;
          const center = showFix ? estPos : dronePos;
          fillPossiblePositions(possibleSource, center);
        }

        const pulse = 0.5 + 0.5 * Math.sin(nowMs * 0.014);
        fixCoreMat.opacity = 0.62 + 0.38 * pulse;
        fixGlowMat.opacity = 0.18 + 0.36 * pulse;
        fixCoreMat.size = 1.0 + 0.8 * pulse;
        fixGlowMat.size = 1.8 + 1.6 * pulse;

        const pulse2 = 0.5 + 0.5 * Math.sin(nowMs * 0.012 + 1.7);
        possibleMat.opacity = 0.35 + 0.45 * pulse2;
        possibleGlowMat.opacity = 0.12 + 0.24 * pulse2;
        possibleMat.size = 0.5 + 0.55 * pulse2;
        possibleGlowMat.size = 0.95 + 0.95 * pulse2;

        for (let i = 0; i < satellites.length; i++){
          const s = satellites[i];
          const r = rowRefs[i];
          const isSelected = activeSatIds.has(s.id);
          const sphereActive = manualSphereSatIds.has(s.id);

          r.tdUse.textContent = s.inRange ? t('yes') : t('no');
          r.tdRange.textContent = s.measuredRange == null ? '--' : s.measuredRange.toFixed(2);

          r.tdUse.className = s.inRange ? 'ok' : 'bad';
          r.tdActive.className = s.inRange ? 'mid' : '';

          r.sphereBtn.disabled = !(s.inRange && isSelected);
          r.sphereBtn.classList.toggle('on', s.inRange && isSelected && sphereActive);
          r.sphereBtn.classList.toggle('off', !s.inRange || !isSelected || !sphereActive);
          r.sphereBtn.textContent = (s.inRange && isSelected && sphereActive) ? t('on') : t('off');
        }

        updateActiveButtons();

        const displaySelectedCount = selectedMode ? selectedCount : usableCount;
        const confCount = selectedMode ? activeUsable.length : allEffectiveUsable.length;
        const conf = confidenceFromSolve(confCount);

        ui.selectedCount.textContent = String(displaySelectedCount);
        ui.possibleCount.textContent = String(lastPossibleCount);
        ui.confidenceText.textContent = conf.text;
        ui.confidenceText.classList.remove('conf-low', 'conf-mid', 'conf-high');
        if (conf.level === 'high') ui.confidenceText.classList.add('conf-high');
        else if (conf.level === 'mid') ui.confidenceText.classList.add('conf-mid');
        else ui.confidenceText.classList.add('conf-low');
      }

      let lastTime = performance.now();
      let simTime = 0;

      function animate(now){
        const dt = Math.min((now - lastTime)/1000, 0.05);
        lastTime = now;
        simTime += dt;

        if (autoDrone){
          droneState.latDeg = 25 * Math.sin(simTime * 0.22);
          droneState.lonDeg = (simTime * 18) % 360 - 180;
          droneState.alt = 1.0 + 1.1 * (0.5 + 0.5 * Math.sin(simTime * 0.6));
          syncSliders();
        }

        if (!satellitesPaused){
          for (const s of satellites) updateSatellitePosition(s, simTime);
        }

        earthSpinGroup.rotation.y += dt * EARTH_ROT_SPEED;
        cloudLayer.rotation.y += dt * (EARTH_ROT_SPEED * 1.35);

        const dronePos = updateDroneModel();
        updateAll(dronePos, dt, now);

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function init(){
        enableSatelliteSound();
        syncSliders();
        updateButtonTexts();
        applyLanguage();
        updateActiveButtons();
        updateSoundButtonText();

        for (const s of satellites) updateSatellitePosition(s, 0);
        const startPos = updateDroneModel();
        updateAll(startPos, 0.016, performance.now());

        ui.loadingOverlay.style.display = 'none';
        requestAnimationFrame(animate);
      }

      init();
    }
  </script>
