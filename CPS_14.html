<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drone Traffic Control Simulation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px;
      margin: 2px;
      background: #f0f0f0;
      overflow-x: hidden;
    }
    h2[data-translate="title"] { margin: 4px 0; text-align: center; }
    p[data-translate="instruction"] { margin: 2px 0 6px; text-align: center; max-width: 96vw; }

    #game-container {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      width: 100%;
      max-width: 1780px;
      align-items: stretch;
    }

    .left-panel, .right-panel { width: 50%; min-width: 0; }
    .left-panel { display: flex; flex-direction: column; }

    #obstacle-course {
      width: 100%;
      height: 560px;
      border: 2px solid #000;
      background: #fff;
      position: relative;
    }

    #left-message {
      margin-top: 6px;
      min-height: 44px;
      width: 100%;
      font-weight: bold;
      text-align: center;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #code-area {
      width: 100%;
      border: 2px solid #000;
      padding: 8px;
      background: #fff;
      overflow: hidden;
      position: relative;
      min-height: 560px;
    }

#command-buttons {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 8px;
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
  width: 100%;
  min-width: 0;
}

.button-row {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-wrap: nowrap;
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
  overflow: visible;
  width: 100%;
  min-width: 0;
}

.button-row.if-then-row,
.button-row.if-then-else-row,
.button-row.repeat-row,
.button-row.xyz-tools-row {
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-width: 0;
}

.left-cluster,
.right-cluster {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-wrap: nowrap;
  min-width: 0;
}

.left-cluster {
  flex: 1 1 auto;
  min-width: 0;
}

.right-cluster {
  flex: 0 0 auto;
  margin-left: auto;
  justify-content: flex-end;
}

.right-cluster > * {
  flex-shrink: 0;
}

.select-label,
.control-select,
.project-menu-wrap,
.project-button,
#slow-motion-button,
#slow-motion-factor {
  flex-shrink: 0;
}

.button-row.if-then-row,
.button-row.if-then-else-row,
.button-row.repeat-row,
.button-row.xyz-tools-row {
  justify-content: space-between;
  align-items: center;
}

    .button-row span,
    .button-row label,
    .button-row button,
    .button-row select,
    .carousel-header span,
    .page-dot,
    #view-controls button,
    .panel-buttons button,
    .center-buttons button,
    #help-button,
    #language-switch {
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

.button-row input,
.button-row select {
  padding: 1px 3px;
  max-width: 72px;
  min-width: 46px;
  height: 22px;
  font-size: 10px;
  flex-shrink: 0;
}

    .button-row input::placeholder { font-size: 9px; }
    .small-input { max-width: 54px !important; min-width: 34px !important; }
    .slow-motion-input { max-width: 54px !important; min-width: 35px !important; }

    button {
      padding: 4px 6px;
      font-size: 11px;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:disabled,
    select:disabled,
    input:disabled,
    textarea:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .green-button { background: #4CAF50; }
    .orange-button { background: #FFA500; }
    .blue-button { background: #0000FF; }
    .brown-button { background: #8B4513; }
    .yellow-button { background: #FFD700; color: #222; font-weight: bold; }

    .select-label {
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .drone-label-color { color: #1565c0; }
    .checkpoint-label-color { color: #6a1b9a; }
    .tunnel-label-color { color: #2e7d32; }

    .control-select {
      border: 2px solid;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      padding: 2px 6px;
      min-width: 76px;
      height: 26px;
      font-size: 11px;
    }

    .drone-select { background: #1565c0; border-color: #0d47a1; }
    .checkpoint-select { background: #6a1b9a; border-color: #4a148c; min-width: 90px; }
    .tunnel-select { background: #2e7d32; border-color: #1b5e20; min-width: 78px; }


.project-menu-wrap {
  position: relative;
  display: flex;
  align-items: center;
  flex: 0 0 auto;
}

.project-button {
  background: #37474f;
  border: 2px solid #263238;
  min-width: 90px;
  height: 26px;
  font-size: 11px;
  font-weight: bold;
  color: #fff;
  padding: 2px 8px;
}

.project-menu {
  display: none;
  position: absolute;
  top: 32px;
  right: 0;
  min-width: 170px;
  background: #fff;
  border: 2px solid #444;
  border-radius: 6px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.18);
  z-index: 9999;
  overflow: hidden;
}

.project-menu.show {
  display: block;
}

.project-menu-item {
  padding: 8px 12px;
  font-size: 12px;
  font-weight: bold;
  color: #222;
  background: #f7f7f7;
  cursor: pointer;
  border-bottom: 1px solid #ddd;
}

.project-menu-item:last-child {
  border-bottom: none;
}

.project-menu-item:hover {
  background: #e3f2fd;
}

.project-menu-item.saved-slot {
  background: #ffd54f;
  color: #222;
}

.project-menu-item.saved-slot:hover {
  background: #ffca28;
}

.project-menu-item.load-disabled {
  background: #eeeeee;
  color: #999;
  cursor: not-allowed;
}

    .control-select option {
      background: #fff;
      color: #222;
      font-weight: normal;
    }

    .control-button {
      margin-top: 8px;
      padding: 8px 10px;
      font-size: 15px;
    }

    .run-button { background: #FF0000; }
    .reset-button { background: #FFC0CB; color: #000; }
    .path-preview-button { background: #0000FF; }
    .centre-button { background: #008CBA; }
    .run-together-button { background: #8B0000; }
    .all-path-preview-button { background: #6b4f00; }

    #help-button {
      position: absolute;
      top: 8px;
      right: 8px;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      z-index: 3;
      background: #6A5ACD;
      padding: 5px 14px;
      font-size: 14px;
    }

    .slow-motion-button.active {
      box-shadow: 0 0 0 2px #000 inset;
      background: #e6c200;
    }

    .carousel-section { margin-top: 8px; width: 100%; }

    .carousel-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .carousel-header span {
      font-weight: bold;
      font-size: 13px;
      color: #333;
    }

    .carousel-window {
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      touch-action: pan-y;
      cursor: grab;
    }

    .carousel-window.dragging { cursor: grabbing; }
    .carousel-window.split-static { cursor: default; }

    .carousel-track {
      display: flex;
      will-change: transform;
      transition: transform 0.38s ease;
      width: 100%;
    }

    .carousel-track.split-two,
    .carousel-track.split-one {
      transform: translateX(0) !important;
      transition: none !important;
    }

    .carousel-slide {
      padding: 0 5px;
      flex: 0 0 50%;
      width: 50%;
      min-width: 50%;
      max-width: 50%;
    }

    .carousel-slide.empty-slide { pointer-events: none; }
    .carousel-slide.empty-slide .drone-panel {
      background: transparent;
      border: 2px dashed #d8d8d8;
      min-height: 255px;
    }
    .carousel-slide.empty-slide .drone-panel h3 { visibility: hidden; }

    .drone-panel {
      width: 100%;
      border: 2px solid #ccc;
      border-radius: 6px;
      padding: 7px;
      background: #fafafa;
      min-width: 0;
    }

    .drone-panel-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 0 0 6px 0;
      min-width: 0;
      flex-wrap: wrap;
    }

    .drone-panel h3 {
      margin: 0;
      font-size: 15px;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      font-weight: bold;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .energy-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 0 0 auto;
      min-width: 0;
      max-width: 210px;
    }

    .energy-bar-outer {
      position: relative;
      height: 16px;
      flex: 1;
      min-width: 95px;
      max-width: 150px;
      background: #e0e0e0;
      border: 2px solid #888;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.6) inset;
    }

    .energy-bar-inner {
      height: 100%;
      width: 100%;
      border-radius: 10px;
      transition: width 0.08s linear, background 0.12s linear;
      background: #1e88e5;
    }

    .energy-bar-inner.blink-red { animation: batteryBlink 0.8s infinite; }

    .energy-percent {
      font-size: 11px;
      font-weight: bold;
      color: #333;
      min-width: 48px;
      text-align: right;
      white-space: nowrap;
    }

    @keyframes batteryBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .code-editor-shell {
      position: relative;
      width: 100%;
      height: 180px;
      border: 1px solid #aaa;
      background: #fff;
      overflow: hidden;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 18px;
    }

    .code-highlight {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 6px;
      overflow: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      pointer-events: none;
      color: transparent;
      background: transparent;
      z-index: 1;
    }

    .code-highlight .active-line {
      color: #d60000;
      font-weight: bold;
      background: rgba(255, 0, 0, 0.08);
      display: inline;
    }

    .code-highlight .normal-line { color: transparent; }

    .code-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      resize: none;
      border: none;
      outline: none;
      padding: 6px;
      background: transparent;
      color: #111;
      z-index: 2;
      overflow: auto;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 18px;
      caret-color: #111;
    }

    .panel-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .center-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .bottom-right-row {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    #view-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    #view-controls button {
      border: 2px solid #8B4513;
      background: white;
      color: #8B4513;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #language-switch {
      position: fixed;
      top: 10px;
      right: 100px;
      padding: 5px 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      z-index: 1001;
    }

    .page-indicators {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .page-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #bbb;
      transition: transform 0.2s, background 0.2s;
    }

    .page-dot.active {
      background: #008CBA;
      transform: scale(1.2);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: rgba(0,0,0,0.4);
    }

    .modal-content {
      background: #fefefe;
      margin: 4% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 84%;
      max-width: 760px;
      border-radius: 8px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .close {
      float: right;
      font-size: 28px;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
      user-select: none;
    }

    .close:hover { color: black; }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      margin-top: 10px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .modal-footer {
      margin-top: 20px;
      text-align: right;
    }

    .button {
      margin: 5px;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    .next-button, .prev-button {
      background: #008CBA;
      color: white;
    }

    .close-button {
      background: #f44336;
      color: white;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .blink { animation: blink 1s infinite; }

    @keyframes colorChange {
      0% { color: red; }
      33% { color: #ff6600; }
      66% { color: #990000; }
      100% { color: red; }
    }

    .color-change { animation: colorChange 1.2s infinite; }

    @media (max-width: 1400px) {
      .button-row { flex-wrap: wrap; }
.button-row.if-then-row,
.button-row.if-then-else-row,
.button-row.repeat-row,
.button-row.xyz-tools-row { justify-content: flex-start; }
      .left-cluster, .right-cluster {
        flex-wrap: wrap;
        justify-content: flex-start;
      }
    }

    @media (max-width: 1100px) {
      #game-container {
        flex-direction: column;
        align-items: center;
      }

      .left-panel, .right-panel { width: 100%; }

      #obstacle-course, #code-area { width: 100%; }

      #obstacle-course {
        height: 52vw;
        min-height: 360px;
        max-height: 560px;
      }

      #code-area { min-height: auto; }

      .carousel-slide {
        flex: 0 0 100%;
        width: 100%;
        min-width: 100%;
        max-width: 100%;
      }

      .carousel-track.split-one .carousel-slide,
      .carousel-track.split-two .carousel-slide {
        flex: 0 0 50%;
        width: 50%;
        min-width: 50%;
        max-width: 50%;
      }

      .button-row {
        flex-wrap: wrap;
        overflow: visible;
      }

.button-row.if-then-row,
.button-row.if-then-else-row,
.button-row.repeat-row,
.button-row.xyz-tools-row { justify-content: flex-start; }	

      .left-cluster, .right-cluster {
        flex-wrap: wrap;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <button id="language-switch" onclick="toggleLanguage()">繁體中文</button>

  <h2 data-translate="title">Drone Traffic Control Simulation</h2>
  <p data-translate="instruction">
    Create safe flight paths for drones and run them together without crashing.
  </p>

  <div id="game-container">
    <div class="left-panel">
      <div id="obstacle-course"></div>
      <div id="left-message"></div>
    </div>

    <div class="right-panel">
      <div id="code-area">
        <button id="help-button" onclick="openTutorial()" data-translate="helpButton">Tutorial</button>

        <div id="command-buttons">
          <div class="button-row">
            <button class="green-button" onclick="addCommand('takeOff')" data-translate="takeOff">Take Off</button>
            <button class="green-button" onclick="addCommand('land')" data-translate="land">Land</button>
          </div>

          <div class="button-row">
            <button class="green-button" onclick="addCommand('throttleUp')" data-translate="throttleUp">Throttle Up</button>
            <input class="small-input" type="text" id="throttle-distance-up" placeholder="value/var">

            <button class="green-button" onclick="addCommand('throttleDown')" data-translate="throttleDown">Throttle Down</button>
            <input class="small-input" type="text" id="throttle-distance-down" placeholder="value/var">

            <button class="green-button" onclick="addCommand('yawLeft')" data-translate="yawLeft">Yaw Left</button>
            <input class="small-input" type="text" id="yaw-angle" placeholder="value/var">

            <button class="green-button" onclick="addCommand('yawRight')" data-translate="yawRight">Yaw Right</button>
            <input class="small-input" type="text" id="yaw-angle-right" placeholder="value/var">
          </div>

          <div class="button-row">
            <button class="orange-button" onclick="addCommand('pitchForward')" data-translate="pitchForward">Pitch Forward</button>
            <input class="small-input" type="text" id="pitch-distance" placeholder="value/var">

            <button class="orange-button" onclick="addCommand('pitchBackward')" data-translate="pitchBackward">Pitch Backward</button>
            <input class="small-input" type="text" id="pitch-distance-back" placeholder="value/var">

            <button class="orange-button" onclick="addCommand('rollLeft')" data-translate="rollLeft">Roll Left</button>
            <input class="small-input" type="text" id="roll-distance" placeholder="value/var">

            <button class="orange-button" onclick="addCommand('rollRight')" data-translate="rollRight">Roll Right</button>
            <input class="small-input" type="text" id="roll-distance-right" placeholder="value/var">
          </div>

          <div class="button-row xyz-tools-row">
            <div class="left-cluster">
              <button class="brown-button" onclick="addCommand('xyzIncrease')" data-translate="xyzIncrease">XYZ increase</button>
              <input class="small-input" type="text" id="xyz-x" placeholder="x">
              <input class="small-input" type="text" id="xyz-y" placeholder="y">
              <input class="small-input" type="text" id="xyz-z" placeholder="z">

              <button class="brown-button" onclick="addCommand('hover')" data-translate="hover">Hover</button>
              <input class="small-input" type="text" id="hover-seconds" placeholder="sec">
            </div>
            <div class="right-cluster">
              <button id="slow-motion-button" class="yellow-button slow-motion-button" onclick="toggleSlowMotion()" data-translate="slowMotion">Slow Motion</button>
              <input class="slow-motion-input" type="text" id="slow-motion-factor" placeholder="0.1-0.9x">
            </div>
          </div>

          <div class="button-row repeat-row">
            <div class="left-cluster">
              <button class="blue-button" onclick="addCommand('repeat')" data-translate="repeat">Repeat</button>
              <input type="text" id="repeat-times" placeholder="number/var">
              <button class="blue-button" onclick="addCommand('setVariable')" data-translate="setVariable">Set</button>
              <input type="text" id="var-name" placeholder="var">
              <span>to</span>
              <input type="text" id="var-value" placeholder="value">
            </div>

<div class="right-cluster">
  <label for="drone-count-select" class="select-label drone-label-color" data-translate="droneLabel">Drone</label>
  <select id="drone-count-select" class="control-select drone-select" onchange="handleDroneCountSelectChange()">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
</div>
          </div>

<div class="button-row if-then-row">
  <div class="left-cluster">
    <button class="blue-button" onclick="addCommand('ifThen')" data-translate="ifThen">If... then</button>
    <input type="text" id="if-condition" placeholder="condition">
    <span>then</span>
    <input type="text" id="if-then-action" placeholder="action">
  </div>
  <div class="right-cluster">
    <label for="checkpoint-count-select" class="select-label checkpoint-label-color" data-translate="checkpointLabel">Checkpoint</label>
    <select id="checkpoint-count-select" class="control-select checkpoint-select" onchange="handleCheckpointSelectChange()">
      <option value="0" selected>0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>

    <label for="tunnel-toggle-select" class="select-label tunnel-label-color" data-translate="tunnelLabel">Tunnel</label>
    <select id="tunnel-toggle-select" class="control-select tunnel-select" onchange="handleTunnelToggleChange()">
      <option value="off" selected data-translate="tunnelOff">Off</option>
      <option value="on" data-translate="tunnelOn">On</option>
    </select>
  </div>
</div>

<div class="button-row if-then-else-row">
  <div class="left-cluster">
    <button class="blue-button" onclick="addCommand('ifThenElse')" data-translate="ifThenElse">If... then... else</button>
    <input type="text" id="if-condition-else" placeholder="condition">
    <span>then</span>
    <input type="text" id="if-then-action-else" placeholder="action">
    <span>else</span>
    <input type="text" id="if-else-action" placeholder="action">
  </div>

  <div class="right-cluster">
    <div class="project-menu-wrap">
      <button id="project-button" class="control-select project-button" type="button" onclick="toggleProjectMenu(event)">
        Project
      </button>

    minY: box.minY,
    maxY: box.maxY,

    shrunk.maxX -= inset;

  if (axis !== 'y') {
    shrunk.minY += inset;
    shrunk.maxY -= inset;

function segmentInsideSafeTunnel(from, to, cp, inset = TUNNEL_SAFE_INSET) {

  const samples = 96;
  let foundInterior = false;

  for (let i = 0; i <= samples; i++) {
    const t = i / samples;
    const p = from.clone().lerp(to, t);

    let insideRealTunnel = false;
    let insideSafeTunnel = false;

    for (const tb of cp.tunnelBoxes) {
      const shrunk = getShrunkTunnelBox(tb, inset);

      if (
        shrunk.minX >= shrunk.maxX ||
        shrunk.minY >= shrunk.maxY ||
        shrunk.minZ >= shrunk.maxZ
      ) {
        continue;
      }

      if (isPointInsideAABB(p, tb, 0)) insideRealTunnel = true;
      if (isPointInsideAABB(p, shrunk, 0)) insideSafeTunnel = true;
    }

    if (insideRealTunnel) {
      foundInterior = true;
      if (!insideSafeTunnel) return false;
    }
  }

function findEarliestTunnelTouchForSegment(from, to, cp, inset = TUNNEL_SAFE_INSET) {
  if (!tunnelsEnabled || !cp.tunnelBoxes || !cp.tunnelBoxes.length) return null;

  const samples = 160;
  let bestT = null;

  for (const tb of cp.tunnelBoxes) {
    const shrunk = getShrunkTunnelBox(tb, inset);

    if (
      shrunk.minX >= shrunk.maxX ||
      shrunk.minY >= shrunk.maxY ||
      shrunk.minZ >= shrunk.maxZ
    ) {
      continue;
    }

    for (let i = 0; i <= samples; i++) {

      const p = from.clone().lerp(to, t);

      const insideOriginal = isPointInsideAABB(p, tb, 0);
      if (!insideOriginal) continue;

      const insideSafe = isPointInsideAABB(p, shrunk, 0);

function lineAABBIntersectionT(from, to, bounds, expand = 0) {
  const dir = to.clone().sub(from);
  let tmin = 0;
  let tmax = 1;

  const minX = bounds.minX - expand;
  const maxX = bounds.maxX + expand;
  const minY = bounds.minY !== undefined ? bounds.minY - expand : bounds.baseY - expand;
  const maxY = bounds.maxY !== undefined ? bounds.maxY + expand : bounds.topY + expand;
  const minZ = bounds.minZ - expand;
  const maxZ = bounds.maxZ + expand;

  const axes = [
    { start: from.x, delta: dir.x, min: minX, max: maxX },
    { start: from.y, delta: dir.y, min: minY, max: maxY },
    { start: from.z, delta: dir.z, min: minZ, max: maxZ }
  ];

  for (const axis of axes) {
    if (Math.abs(axis.delta) < EPS) {
      if (axis.start < axis.min || axis.start > axis.max) return null;
    } else {
      let t1 = (axis.min - axis.start) / axis.delta;
      let t2 = (axis.max - axis.start) / axis.delta;
      if (t1 > t2) [t1, t2] = [t2, t1];
      tmin = Math.max(tmin, t1);
      tmax = Math.min(tmax, t2);
      if (tmin > tmax) return null;
    }
  }

  if (tmax < 0 || tmin > 1) return null;
  return Math.max(0, Math.min(1, tmin));

function segmentLikelyInsideTunnel(from, to, tunnelBox, expand = 0) {

function segmentCheckpointSolidHit(from, to, cp, expand = 0) {

    return lineAABBIntersectionT(from, to, stageBounds, expand);

  // That expanded solid conflicts with tunnel entry.
  const rawStageHitT = lineAABBIntersectionT(from, to, stageBounds, 0);
  if (rawStageHitT === null) return null;

  const samples = 160;

  for (let i = 0; i <= samples; i++) {
    const t = i / samples;
    const p = from.clone().lerp(to, t);

    const insideStage =
      p.x >= stageBounds.minX &&
      p.x <= stageBounds.maxX &&
      p.y >= stageBounds.baseY &&
      p.y <= stageBounds.topY &&
      p.z >= stageBounds.minZ &&
      p.z <= stageBounds.maxZ;

    if (!insideStage) continue;

    let insideRealTunnel = false;
    let insideSafeTunnel = false;

    for (const tb of cp.tunnelBoxes) {
      const shrunk = getShrunkTunnelBox(tb, TUNNEL_SAFE_INSET);

      if (
        shrunk.minX >= shrunk.maxX ||
        shrunk.minY >= shrunk.maxY ||
        shrunk.minZ >= shrunk.maxZ
      ) {
        continue;
      }

      if (isPointInsideAABB(p, tb, 0)) insideRealTunnel = true;
      if (isPointInsideAABB(p, shrunk, 0)) insideSafeTunnel = true;
    }

    // If we are inside the stage but not safely inside tunnel void, it's a hit.
    if (!insideRealTunnel || !insideSafeTunnel) {
      return t;
    }
  }

  return null;
}

      ctx.beginPath();

function getProjectStorageKey(slot) {

function collectProjectData() {
  storeCurrentCodes();

  const codeValues = {};
  droneIds.forEach(id => {
    codeValues[id] = String(storedCodeValues[id] || '');
  });

  const checkpointPositions = checkpointsState.visible && checkpointsState.items.length
    ? checkpointsState.items.map(cp => ({
        id: cp.id,
        x: cp.position.x,
        z: cp.position.z
      }))
    : [];

  return {
    activeDroneCount,
    checkpointMode: checkpointsState.visible ? checkpointsState.mode : 0,
    checkpointPositions,
    tunnelsEnabled,
    slowMotionEnabled,
    slowMotionFactor,
    currentLanguage,
    codeValues
  };
}

function hasProjectSlotData(slot) {
  return !!localStorage.getItem(getProjectStorageKey(slot));
}

function saveProjectSlot(slot) {
  try {
    if (togetherExecutionState.isRunning || globalCrashSequenceActive) return;

    storeCurrentCodes();

    // Hard sync again from all rendered inputs before save
    droneIds.forEach(id => {
      const inputs = getAllCodeInputsForDrone(id);
      inputs.forEach(el => {
        const v = el.value || '';
        if (v.length > (storedCodeValues[id] || '').length) {
          storedCodeValues[id] = v;
        }
      });
    });

    if (hasProjectSlotData(slot)) {
      const yes = confirm(translations[currentLanguage].projectOverwriteConfirm);
      if (!yes) {
        closeProjectMenu();
        return;
      }
    }

    const data = collectProjectData();
    localStorage.setItem(getProjectStorageKey(slot), JSON.stringify(data));

    updateProjectMenuUI();
    closeProjectMenu();
    setMessageByKey('projectSaved');
  } catch (e) {
    console.error('Failed to save project slot:', e);
  }
}

function loadProjectSlot(slot) {
  try {
    if (togetherExecutionState.isRunning || globalCrashSequenceActive) return false;

    const raw = localStorage.getItem(getProjectStorageKey(slot));
    if (!raw) {
      setMessageByKey('projectEmpty');
      closeProjectMenu();
      return false;
    }

    const data = JSON.parse(raw);

    forceStopAllExecutionStates();
    clearMessage();
    clearAllPreviewPaths();

    activeDroneCount = Math.min(5, Math.max(1, parseInt(data.activeDroneCount, 10) || 1));
    slowMotionEnabled = !!data.slowMotionEnabled;
    slowMotionFactor = (typeof data.slowMotionFactor === 'number' && data.slowMotionFactor >= 0.1 && data.slowMotionFactor <= 0.9)
      ? data.slowMotionFactor
      : 1;

    if (data.currentLanguage === 'en' || data.currentLanguage === 'zh') {
      currentLanguage = data.currentLanguage;
    }

    droneIds.forEach(id => {
      storedCodeValues[id] = (data.codeValues && typeof data.codeValues[id] === 'string') ? data.codeValues[id] : '';
    });

    droneIds.forEach(id => resetDroneState(id, false));

    updateDroneAndPadLayout(true);

const checkpointMode = Math.max(0, Math.min(5, parseInt(data.checkpointMode, 10) || 0));

if (checkpointMode === 0) {
  tunnelsEnabled = false;
  clearCheckpointObjects();
} else {
  tunnelsEnabled = !!data.tunnelsEnabled;

  const restored = restoreCheckpointPositionsToState(
    checkpointMode,
    data.checkpointPositions
  );

  generateCheckpoints(checkpointMode, restored);
}

    rebuildIndicators();

function updateProjectMenuUI() {
  const projectButton = document.getElementById('project-button');
  const save1 = document.getElementById('project-save-1');
  const load1 = document.getElementById('project-load-1');
  const save2 = document.getElementById('project-save-2');
  const load2 = document.getElementById('project-load-2');
  const save3 = document.getElementById('project-save-3');
  const load3 = document.getElementById('project-load-3');

  if (projectButton) {
    projectButton.textContent = translations[currentLanguage].projectButton || 'Project';
    projectButton.disabled = togetherExecutionState.isRunning || globalCrashSequenceActive;
  }

  const config = [
    { saveEl: save1, loadEl: load1, slot: 1, saveKey: 'projectSave1', loadKey: 'projectLoad1' },
    { saveEl: save2, loadEl: load2, slot: 2, saveKey: 'projectSave2', loadKey: 'projectLoad2' },
    { saveEl: save3, loadEl: load3, slot: 3, saveKey: 'projectSave3', loadKey: 'projectLoad3' }
  ];

  config.forEach(({ saveEl, loadEl, slot, saveKey, loadKey }) => {
    const saved = hasProjectSlotData(slot);

    if (saveEl) {
      saveEl.textContent = translations[currentLanguage][saveKey] || `Save to Project ${slot}`;
      saveEl.classList.toggle('saved-slot', saved);
      saveEl.oncontextmenu = (event) => handleProjectSlotRightClick(event, slot);
    }

    if (loadEl) {
      loadEl.textContent = translations[currentLanguage][loadKey] || `Load Project ${slot}`;
      loadEl.classList.toggle('saved-slot', saved);
      loadEl.classList.toggle('load-disabled', !saved);
      loadEl.oncontextmenu = (event) => handleProjectSlotRightClick(event, slot);
    }
  });
}

    function createDrone(droneId) {
      const state = droneStates[droneId];
      state.frontCircles = [];
      state.rearCircles = [];
      state.bodyMeshes = [];
      state.propMeshes = [];
      state.originalBodyColors = [];
      state.brokenPieces = [];
      state.isBroken = false;

      const droneGroup = new THREE.Group();

      const bodyMaterial = new THREE.MeshPhongMaterial({ color: state.color, shininess: 60 });
      const bodyGeometry = new THREE.BoxGeometry(14, 4, 14);
      const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
      droneGroup.add(body);
      state.bodyMeshes.push(body);
      state.originalBodyColors.push(body.material.color.clone());

      const armMaterial = new THREE.MeshPhongMaterial({ color: 0x555555, shininess: 80 });
      const arm1 = new THREE.Mesh(new THREE.BoxGeometry(26, 1.2, 2), armMaterial.clone());
      const arm2 = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 26), armMaterial.clone());
      droneGroup.add(arm1); droneGroup.add(arm2);
      state.bodyMeshes.push(arm1, arm2);
      state.originalBodyColors.push(arm1.material.color.clone(), arm2.material.color.clone());

      const motorGeometry = new THREE.CylinderGeometry(2.2, 2.2, 1.2, 20);
      const motorMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
      const propGeometry = new THREE.CylinderGeometry(6, 6, 0.3, 24);
      const propMaterial = new THREE.MeshPhongMaterial({ color: 0x222222, transparent: true, opacity: 0.35 });
      const lightGeometry = new THREE.CylinderGeometry(2.1, 2.1, 0.35, 24);
      const frontLightMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 1 });
      const rearLightMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 1 });

      const rotorPositions = [
        { x: -11, z: -11, light: 'rear' },
        { x: 11, z: -11, light: 'rear' },
        { x: -11, z: 11, light: 'front' },
        { x: 11, z: 11, light: 'front' }
      ];

      rotorPositions.forEach(r => {
        const motor = new THREE.Mesh(motorGeometry, motorMaterial.clone());
        motor.position.set(r.x, 2.2, r.z);
        droneGroup.add(motor);
        state.bodyMeshes.push(motor);
        state.originalBodyColors.push(motor.material.color.clone());

        const prop = new THREE.Mesh(propGeometry, propMaterial.clone());
        prop.position.set(r.x, 3.2, r.z);
        droneGroup.add(prop);
        state.propMeshes.push(prop);
        state.bodyMeshes.push(prop);
        state.originalBodyColors.push(prop.material.color.clone());

        const lightMat = r.light === 'front' ? frontLightMaterial.clone() : rearLightMaterial.clone();
        const light = new THREE.Mesh(lightGeometry, lightMat);
        light.rotation.x = Math.PI / 2;
        light.position.set(r.x, 3.6, r.z);
        droneGroup.add(light);
        state.bodyMeshes.push(light);
        state.originalBodyColors.push(new THREE.Color(light.material.color.getHex()));

        if (r.light === 'front') state.frontCircles.push(light);
        else state.rearCircles.push(light);
      });

      const triangleShape = new THREE.Shape();
      triangleShape.moveTo(0, 3);
      triangleShape.lineTo(-2.8, -2.2);
      triangleShape.lineTo(2.8, -2.2);
      triangleShape.lineTo(0, 3);

      const triangleGeometry = new THREE.ExtrudeGeometry(triangleShape, { depth: 0.8, bevelEnabled: false });
      const triangleMaterial = new THREE.MeshPhongMaterial({ color: 0xffff00 });
      const triangle = new THREE.Mesh(triangleGeometry, triangleMaterial);
      triangle.rotation.x = -Math.PI / 2;
      triangle.position.set(0, 2.8, 2.2);
      droneGroup.add(triangle);
      state.bodyMeshes.push(triangle);
      state.originalBodyColors.push(triangle.material.color.clone());

      const legMaterial = new THREE.MeshPhongMaterial({ color: 0x444444 });
      const legPositions = [
        [-5, -2.8, -4],
        [5, -2.8, -4],
        [-5, -2.8, 4],
        [5, -2.8, 4]
      ];

      legPositions.forEach(([x, y, z]) => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 5, 8), legMaterial.clone());
        leg.position.set(x, y, z);
        droneGroup.add(leg);
        state.bodyMeshes.push(leg);
        state.originalBodyColors.push(leg.material.color.clone());
      });

      const skid1 = new THREE.Mesh(new THREE.BoxGeometry(14, 0.6, 1), legMaterial.clone());
      skid1.position.set(0, -5.2, -4);
      droneGroup.add(skid1);
      state.bodyMeshes.push(skid1);
      state.originalBodyColors.push(skid1.material.color.clone());

      const skid2 = new THREE.Mesh(new THREE.BoxGeometry(14, 0.6, 1), legMaterial.clone());
      skid2.position.set(0, -5.2, 4);
      droneGroup.add(skid2);
      state.bodyMeshes.push(skid2);
      state.originalBodyColors.push(skid2.material.color.clone());

      droneGroup.position.copy(state.defaultPosition);
      droneGroup.rotation.copy(state.defaultRotation);
      droneGroup.scale.set(droneScaleFactor, droneScaleFactor, droneScaleFactor);

      scene.add(droneGroup);
      state.drone = droneGroup;
      state.position = state.defaultPosition.clone();
    }

    function createCoordinatePlane() {
      gridHelper = new THREE.GridHelper(baseGroundSize, 44, 0x999999, 0xcccccc);
      gridHelper.position.set(0, 0, 0);
      scene.add(gridHelper);

      const loader = new THREE.FontLoader();
      loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', font => {
        labelFont = font;
        const mat = new THREE.MeshBasicMaterial({ color: 0x000000 });

        for (let i = -220; i <= 220; i += 20) {
          if (i !== 0) {
            createText(font, mat, i.toString(), i, 0.1, 8);
            createText(font, mat, i.toString(), -8, 0.1, -i);
          }
        }

        createText(font, mat, 'X', 232, 0.1, 8);
        createText(font, mat, 'Y', -8, 0.1, -232);
        createText(font, mat, 'Z', 0, 205, 0);
      });
    }

    function createText(font, material, text, x, y, z) {
      const geometry = new THREE.TextGeometry(text, { font, size: 5, height: 0.5 });
      const mesh = new THREE.Mesh(geometry, material);
      if (y <= 1) mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, y, z);
      scene.add(mesh);
    }

    function createDroneLandingPad(position, padColor, hColor) {
      const padGroup = new THREE.Group();

      const baseGeometry = new THREE.CylinderGeometry(11, 11, 0.8, 32);
      const baseMaterial = new THREE.MeshPhongMaterial({ color: 0x4a4a4a });
      const base = new THREE.Mesh(baseGeometry, baseMaterial);
      base.position.y = 0.4;
      padGroup.add(base);

      const topGeometry = new THREE.CylinderGeometry(9.8, 9.8, 0.25, 32);
      const topMaterial = new THREE.MeshPhongMaterial({ color: padColor });
      const top = new THREE.Mesh(topGeometry, topMaterial);
      top.position.y = 0.95;
      padGroup.add(top);

      const ringMat = new THREE.MeshBasicMaterial({ color: hColor });
      const ring = new THREE.Mesh(new THREE.TorusGeometry(6.2, 0.6, 16, 60), ringMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 1.18;
      padGroup.add(ring);

      padGroup.position.set(position.x, 0, position.z);
      scene.add(padGroup);
      return padGroup;
    }

    function rebuildLandingPads() {
      Object.values(landingPadGroups).forEach(group => { if (group) scene.remove(group); });
      landingPadGroups = {};

    function parseCode(code) {
      const lines = code.split('\n');
      const commands = [];
      const stack = [];

      function procLine(line, lineIndex) {
        if (line.startsWith('set ')) {
          const m = line.match(/set (\w+)\s*(?:=|to)\s*(.+)/);
          if (m) return { type: 'set', varName: m[1], expression: m[2], lineIndex };
          return null;
        }
        if (line.match(/^repeat\s+(.+)\s+times$/i)) {
          const m = line.match(/^repeat\s+(.+)\s+times$/i);
          return { type: 'repeat', countExpression: m[1], commands: [], lineIndex };
        }
        if (line.match(/^if\s+(.+)\s+then$/i)) {
          const m = line.match(/^if\s+(.+)\s+then$/i);
          return { type: 'if', condition: m[1], thenCommands: [], elseCommands: [], inElse: false, lineIndex };
        }
        if (line === 'else') return { type: 'else', lineIndex };
        if (line === '{') return { type: 'open-block', lineIndex };
        if (line === '}') return { type: 'end-block', lineIndex };
        return { type: 'command', value: line, lineIndex };
      }

      for (let rawIndex = 0; rawIndex < lines.length; rawIndex++) {
        const raw = lines[rawIndex];
        const line = raw.trim();
        if (!line) continue;
        const p = procLine(line, rawIndex);
        if (!p) continue;

        if (p.type === 'open-block') continue;
        else if (p.type === 'repeat' || p.type === 'if') stack.push(p);
        else if (p.type === 'else') {
          if (stack.length && stack[stack.length - 1].type === 'if') stack[stack.length - 1].inElse = true;
        } else if (p.type === 'end-block') {
          const block = stack.pop();
          if (!block) continue;

          let completed;
          if (block.type === 'repeat') {
            completed = { type: 'repeat', countExpression: block.countExpression, commands: block.commands, lineIndex: block.lineIndex };
          } else {
            completed = { type: 'if', condition: block.condition, thenCommands: block.thenCommands, elseCommands: block.elseCommands, lineIndex: block.lineIndex };
          }

          if (stack.length) {
            const parent = stack[stack.length - 1];
            if (parent.type === 'repeat') parent.commands.push(completed);
            else if (parent.type === 'if') {
              if (!parent.inElse) parent.thenCommands.push(completed);
              else parent.elseCommands.push(completed);
            }
          } else commands.push(completed);
        } else if (stack.length) {
          const parent = stack[stack.length - 1];
          if (parent.type === 'repeat') parent.commands.push(p);
          else if (parent.type === 'if') {
            if (!parent.inElse) parent.thenCommands.push(p);
            else parent.elseCommands.push(p);
          }
        } else commands.push(p);
      }

      return commands;
    }

    function evaluateExpression(expr, vars) {
      try {
        return Function(...Object.keys(vars), `return ${expr}`)(...Object.values(vars));
      } catch (e) {
        console.error(`Error eval: "${expr}"`, e);
        return 0;
      }
    }

    function executeCommands(cmds) {
      const vars = {};
      const final = [];

      function exec(c) {
        if (c.type === 'set') {
          vars[c.varName] = evaluateExpression(c.expression, vars);
        } else if (c.type === 'repeat') {
          let cnt = evaluateExpression(c.countExpression, vars);
          if (isNaN(cnt) || cnt <= 0) cnt = 1;
          cnt = Math.round(cnt);
          for (let i = 0; i < cnt; i++) c.commands.forEach(exec);
        } else if (c.type === 'if') {
          const cond = evaluateExpression(c.condition, vars);
          (cond ? c.thenCommands : c.elseCommands).forEach(exec);
        } else if (c.type === 'command') {
          const parts = c.value.split(' ');
          if (parts[0].startsWith('//')) return;
          if (parts[0].toLowerCase() === 'hover') {
            const secToken = parts.slice(1).join('').trim().toLowerCase();
            const cleaned = secToken.endsWith('s') ? secToken.slice(0, -1) : secToken;
            const secs = evaluateExpression(cleaned, vars);
            final.push({ text: `hover ${secs}s`, lineIndex: c.lineIndex });
            return;
          }
          const ep = parts.map((p, i) => i > 0 ? evaluateExpression(p, vars) : p);
          final.push({ text: ep.join(' '), lineIndex: c.lineIndex });
        }
      }

      cmds.forEach(exec);
      return final;
    }

    function getCurrentlyFlyingDroneIds() {
