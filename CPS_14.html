    function dronesEligibleForCollision(a, b) {
      const sa = droneStates[a];
      const sb = droneStates[b];

      if (!isDroneActive(a) || !isDroneActive(b)) return false;

      const aInactiveOnPad = !sa.hasTakenOff && Math.abs(sa.position.y - getDroneSurfaceYForCurrentLocation(a)) < 0.01;
      const bInactiveOnPad = !sb.hasTakenOff && Math.abs(sb.position.y - getDroneSurfaceYForCurrentLocation(b)) < 0.01;
      if (aInactiveOnPad || bInactiveOnPad) return false;

      return true;
    }

    function detectAllCollisionGroupsFromCurrentPositions(candidateIds = null) {
      const activeFlying = (candidateIds ? candidateIds.slice() : getCurrentlyFlyingDroneIds())
        .filter(id => {
          const s = droneStates[id];
          return isDroneActive(id) && s.hasTakenOff && !s.markedAsCrashed && !s.isBroken;
        });

      if (activeFlying.length < 2) return [];

      const parent = {};
      activeFlying.forEach(id => parent[id] = id);

      function find(x) {
        if (parent[x] !== x) parent[x] = find(parent[x]);
        return parent[x];
      }

      function union(a, b) {
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) parent[rb] = ra;
      }

      let foundAny = false;
      for (let i = 0; i < activeFlying.length; i++) {
        for (let j = i + 1; j < activeFlying.length; j++) {
          const a = activeFlying[i];
          const b = activeFlying[j];
          if (!dronesEligibleForCollision(a, b)) continue;
          const dist = droneStates[a].position.distanceTo(droneStates[b].position);
          if (dist <= collisionDistance + EPS) {
            union(a, b);
            foundAny = true;
          }
        }
      }

      if (!foundAny) return [];
      const groups = {};
      activeFlying.forEach(id => {
        const root = find(id);
        if (!groups[root]) groups[root] = [];
        groups[root].push(id);
      });

      return Object.values(groups).filter(group => group.length >= 2);
    }

    function getAllCrashedIdsFromGroups(groups) { return [...new Set(groups.flat())]; }

    function resolveCollisionPositionsAtTouch(crashedIds) {
      const unique = [...new Set(crashedIds)];
      if (unique.length < 2) return;

      for (let iter = 0; iter < 40; iter++) {
        let changed = false;

        for (let i = 0; i < unique.length; i++) {
          for (let j = i + 1; j < unique.length; j++) {
            const aId = unique[i];
            const bId = unique[j];
            const aState = droneStates[aId];
            const bState = droneStates[bId];

            const delta = aState.position.clone().sub(bState.position);
            let dist = delta.length();

            if (dist < 0.0001) {
              const prefA = movementFrameContext.progress[aId] || new THREE.Vector3(1, 0, 0);
              const prefB = movementFrameContext.progress[bId] || new THREE.Vector3(-1, 0, 0);
              delta.copy(prefA.clone().sub(prefB));
              dist = delta.length();
              if (dist < 0.0001) {
                delta.set(Math.random() - 0.5, 0, Math.random() - 0.5);
                dist = delta.length() || 1;
              }
            }

            if (dist < collisionDistance) {
              const overlap = collisionDistance - dist;
              const dir = delta.normalize();

              const aProg = movementFrameContext.progress[aId];
              const bProg = movementFrameContext.progress[bId];
              const aMoving = aProg && aProg.lengthSq() > 0.000001;
              const bMoving = bProg && bProg.lengthSq() > 0.000001;

              if (aMoving && bMoving) {
                aState.position.add(dir.clone().multiplyScalar(overlap * 0.5));
                bState.position.add(dir.clone().multiplyScalar(-overlap * 0.5));
              } else if (aMoving) {
                aState.position.add(dir.clone().multiplyScalar(overlap));
              } else if (bMoving) {
                bState.position.add(dir.clone().multiplyScalar(-overlap));
              } else {
                aState.position.add(dir.clone().multiplyScalar(overlap * 0.5));
                bState.position.add(dir.clone().multiplyScalar(-overlap * 0.5));
              }

              aState.drone.position.copy(aState.position);
              bState.drone.position.copy(bState.position);
              changed = true;
            }
          }
        }
        if (!changed) break;
      }
    }

    function triggerCollision() {
      if (collisionDetected) return;
      collisionDetected = true;
      playAudio(warn1Audio);
    }

    function getGroundContactForSegment(fromY, toY, surfaceY) {
      if (fromY >= surfaceY && toY >= surfaceY) return null;
      if (fromY < surfaceY && toY < surfaceY) return 0;
      const denom = toY - fromY;
      if (Math.abs(denom) < EPS) return null;
      const t = (surfaceY - fromY) / denom;
      if (t < -EPS || t > 1 + EPS) return null;
      return Math.max(0, Math.min(1, t));
    }

    function shouldAbortMovementForDrone(droneId) {
      if (isResetPressed) return true;
      const state = droneStates[droneId];
      if (state.forceLandingTriggered && !state.forceLandingInProgress) return true;
      if (state.abortCurrentProgramForBattery && !state.forceLandingInProgress) return true;
      if (state.forceLandingInProgress) return false;
      if (togetherExecutionState.isRunning && togetherExecutionState.isPaused) return false;
      if (!collisionDetected) return false;
      return droneStates[droneId].markedAsCrashed !== true;
    }

    function beginMovementFrame(droneId, mode = '') {
      movementFrameContext.active = true;
      movementFrameContext.movingIds.add(droneId);
      movementFrameContext.progress[droneId] = new THREE.Vector3(0, 0, 0);
      movementFrameContext.startPositions[droneId] = droneStates[droneId].position.clone();
      movementFrameContext.currentSegments[droneId] = null;
      movementFrameContext.collisionSnapshot = null;
      movementFrameContext.mode = mode;
    }

    function registerMovementProgress(droneId, dx, dy, dz) {
      if (!movementFrameContext.active) return;
      if (!movementFrameContext.progress[droneId]) movementFrameContext.progress[droneId] = new THREE.Vector3(0, 0, 0);
      movementFrameContext.progress[droneId].set(dx, dy, dz);
    }

    function registerMovementSegment(droneId, from, to) {
      movementFrameContext.currentSegments[droneId] = { from: from.clone(), to: to.clone() };
    }

    function endMovementFrame(droneId) {
      movementFrameContext.movingIds.delete(droneId);
      delete movementFrameContext.progress[droneId];
      delete movementFrameContext.startPositions[droneId];
      delete movementFrameContext.currentSegments[droneId];

      if (movementFrameContext.movingIds.size === 0) {
        movementFrameContext.active = false;
        movementFrameContext.collisionSnapshot = null;
        movementFrameContext.mode = '';
      }
    }

    function getCandidateMovingCollisionIds() {
      return Array.from(movementFrameContext.movingIds).filter(id => {
        const s = droneStates[id];
        return isDroneActive(id) && s.hasTakenOff && !s.markedAsCrashed && !s.isBroken;
      });
    }

    function squaredDistance(v1, v2) { return v1.distanceToSquared(v2); }

    function findEarliestContinuousCollisionAmongMovingDrones() {
      const ids = getCandidateMovingCollisionIds();
      if (ids.length < 2) return null;

      const collisions = [];

      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          const aId = ids[i];
          const bId = ids[j];
          if (!dronesEligibleForCollision(aId, bId)) continue;

          const segA = movementFrameContext.currentSegments[aId];
          const segB = movementFrameContext.currentSegments[bId];
          if (!segA || !segB) continue;

          const relStart = segA.from.clone().sub(segB.from);
          const relVel = segA.to.clone().sub(segA.from).sub(segB.to.clone().sub(segB.from));

          const A = relVel.dot(relVel);
          const B = 2 * relStart.dot(relVel);
          const C = relStart.dot(relStart) - collisionDistanceSq;

          let earliestT = null;

          if (Math.abs(A) < EPS) {
            if (C <= 0) earliestT = 0;
          } else {
            const disc = B * B - 4 * A * C;
            if (disc >= -EPS) {
              const safeDisc = Math.max(0, disc);
              const sqrtDisc = Math.sqrt(safeDisc);
              const t1 = (-B - sqrtDisc) / (2 * A);
              const t2 = (-B + sqrtDisc) / (2 * A);

              const candidates = [t1, t2].filter(t => t >= -COLLISION_T_EPS && t <= 1 + COLLISION_T_EPS)
                .map(t => Math.max(0, Math.min(1, t)));

              if (candidates.length) earliestT = Math.min(...candidates);
            }
          }

          if (earliestT !== null) collisions.push({ aId, bId, t: earliestT });
        }
      }

      if (!collisions.length) return null;
      collisions.sort((x, y) => x.t - y.t);
      const firstT = collisions[0].t;
      const simultaneous = collisions.filter(c => Math.abs(c.t - firstT) <= COLLISION_T_EPS);

      return { t: firstT, collisions: simultaneous };
    }

    function buildCollisionPairsAtInterpolatedTime(t, movingIds) {
      const positions = {};
      movingIds.forEach(id => {
        const seg = movementFrameContext.currentSegments[id];
        if (!seg) return;
        positions[id] = seg.from.clone().lerp(seg.to, t);
      });

      const pairs = [];
      for (let i = 0; i < movingIds.length; i++) {
        for (let j = i + 1; j < movingIds.length; j++) {
          const aId = movingIds[i];
          const bId = movingIds[j];
          if (!positions[aId] || !positions[bId]) continue;
          if (!dronesEligibleForCollision(aId, bId)) continue;

          const distSq = positions[aId].distanceToSquared(positions[bId]);
          if (distSq <= collisionDistanceSq + EPS) pairs.push({ aId, bId });
        }
      }
      return pairs;
    }

    function applyMovingDronesAtInterpolatedTime(t, movingIds) {
      movingIds.forEach(id => {
        const seg = movementFrameContext.currentSegments[id];
        if (!seg) return;
        const pos = seg.from.clone().lerp(seg.to, t);
        droneStates[id].position.copy(pos);
        droneStates[id].drone.position.copy(pos);
      });
    }

    function buildCollisionGroupsFromPairs(pairs) {
      const ids = [...new Set(pairs.flatMap(p => [p.aId, p.bId]))];
      const parent = {};
      ids.forEach(id => parent[id] = id);

      function find(x) {
        if (parent[x] !== x) parent[x] = find(parent[x]);
        return parent[x];
      }

      function union(a, b) {
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) parent[rb] = ra;
      }

      pairs.forEach(p => union(p.aId, p.bId));

      const groups = {};
      ids.forEach(id => {
        const root = find(id);
        if (!groups[root]) groups[root] = [];
        groups[root].push(id);
      });

      return Object.values(groups).filter(g => g.length >= 2);
    }

    function detectDiscreteCollisionGroupsAtCurrentSubstep(movingIds) {
      const validIds = movingIds.filter(id => {
        const s = droneStates[id];
        return isDroneActive(id) && s.hasTakenOff && !s.markedAsCrashed && !s.isBroken;
      });

      if (validIds.length < 2) return [];
      const pairs = [];

      for (let i = 0; i < validIds.length; i++) {
        for (let j = i + 1; j < validIds.length; j++) {
          const aId = validIds[i];
          const bId = validIds[j];
          if (!dronesEligibleForCollision(aId, bId)) continue;

          const distSq = squaredDistance(droneStates[aId].position, droneStates[bId].position);
          if (distSq <= collisionDistanceSq + EPS) pairs.push({ aId, bId });
        }
      }

      if (!pairs.length) return [];
      return buildCollisionGroupsFromPairs(pairs);
    }

    function snapCollidingPairsExactlyToTouch(collisions, t) {
      const movingIds = Array.from(movementFrameContext.movingIds);
      applyMovingDronesAtInterpolatedTime(t, movingIds);

      collisions.forEach(({ aId, bId }) => {
        const aState = droneStates[aId];
        const bState = droneStates[bId];
        const delta = aState.position.clone().sub(bState.position);
        let dist = delta.length();

        if (dist < EPS) {
          const aSeg = movementFrameContext.currentSegments[aId];
          const bSeg = movementFrameContext.currentSegments[bId];
          const rel = aSeg.to.clone().sub(aSeg.from).sub(bSeg.to.clone().sub(bSeg.from));
          if (rel.lengthSq() > EPS) {
            delta.copy(rel);
            dist = delta.length();
          } else {
            delta.set(1, 0, 0);
            dist = 1;
          }
        }

        const dir = delta.normalize();
        const midpoint = aState.position.clone().add(bState.position).multiplyScalar(0.5);
        const halfSep = collisionDistance * 0.5;

        aState.position.copy(midpoint.clone().add(dir.clone().multiplyScalar(halfSep)));
        bState.position.copy(midpoint.clone().add(dir.clone().multiplyScalar(-halfSep)));
        aState.drone.position.copy(aState.position);
        bState.drone.position.copy(bState.position);
      });
    }

    async function tryCaptureCollisionSnapshotForCurrentFrame(force = false) {
      if (force) return null;
      if (movementFrameContext.collisionSnapshot) return movementFrameContext.collisionSnapshot;

      const movingIds = Array.from(movementFrameContext.movingIds);
      if (!movingIds.length) return null;

      const continuousHit = findEarliestContinuousCollisionAmongMovingDrones();
      if (continuousHit) {
        snapCollidingPairsExactlyToTouch(continuousHit.collisions, continuousHit.t);

        const pairSet = buildCollisionPairsAtInterpolatedTime(continuousHit.t, movingIds);
        const groups = buildCollisionGroupsFromPairs(pairSet.length ? pairSet : continuousHit.collisions);
        const crashedIds = getAllCrashedIdsFromGroups(groups);

        crashedIds.forEach(id => droneStates[id].markedAsCrashed = true);
        resolveCollisionPositionsAtTouch(crashedIds);
        triggerCollision();

        movementFrameContext.collisionSnapshot = {
          type: 'air',
          mode: 'continuous',
          t: continuousHit.t,
          groups,
          crashedIds
        };
        return movementFrameContext.collisionSnapshot;
      }

      const groups = detectDiscreteCollisionGroupsAtCurrentSubstep(movingIds);
      if (!groups.length) return null;

      const crashedIds = getAllCrashedIdsFromGroups(groups);
      crashedIds.forEach(id => droneStates[id].markedAsCrashed = true);
      resolveCollisionPositionsAtTouch(crashedIds);
      triggerCollision();

      movementFrameContext.collisionSnapshot = {
        type: 'air',
        mode: 'discrete',
        groups,
        crashedIds
      };
      return movementFrameContext.collisionSnapshot;
    }

    async function emergencyLandDrone(droneId, myResetGeneration = resetGeneration) {
      const state = droneStates[droneId];
      if (!isDroneActive(droneId) || state.markedAsCrashed || state.isBroken || !state.hasTakenOff) return;
      if (isResetPressed || myResetGeneration !== resetGeneration) return;

      state.forceLandingInProgress = true;
      state.abortCurrentProgramForBattery = true;

      const targetY = getValidLandingSurfaceY(state.position, false, true);
      const distance = Math.max(0, state.position.y - targetY);

      if (distance > 0.01) {
        await animateWorldMove(droneId, {
          dx: 0,
          dy: -distance,
          dz: 0,
          force: true,
          commandBase: 'land',
          minAllowedY: targetY,
          resetToken: myResetGeneration,
          allowStageLanding: true,
          emergencyLanding: true
        });
      }

      if (isResetPressed || myResetGeneration !== resetGeneration) return;

      enforceDroneRestingSurface(droneId, false, true);
      state.hasTakenOff = false;
      state.isExecuting = false;
      state.isPaused = false;
      state.forceLandingInProgress = false;
      state.abortCurrentProgramForBattery = false;
      clearExecutingLine(droneId);
      updateRunButton(droneId);
    }

    async function detectAndResolveEarliestSingleDroneCrash(droneId, from, to, commandBase = '', allowStageLanding = false, emergencyLanding = false, strictStageTouchDuringForcedLanding = false) {
      if (globalCrashSequenceActive || !isDroneActive(droneId) || isResetPressed) return true;

      let earliest = null;

      const checkpointHit = findEarliestCheckpointCollisionForSegment(
        from, to, commandBase, allowStageLanding, emergencyLanding, strictStageTouchDuringForcedLanding
      );
      if (checkpointHit) {
        if (checkpointHit.type === 'battery-landing-touch') {
          earliest = { type: 'battery-touch', t: checkpointHit.t, alertKey: 'lowBatteryCrashAlert', warningKey: 'lowBatteryCrashWarning' };
        } else if (checkpointHit.type === 'tunnel-edge') {
          earliest = { type: 'tunnel-edge', t: checkpointHit.t, alertKey: 'tunnelCrashAlert', warningKey: 'tunnelCrashWarning' };
        } else {
          earliest = { type: 'checkpoint', t: checkpointHit.t, alertKey: 'checkpointCrashAlert', warningKey: 'checkpointCrashWarning' };
        }
        if (checkpointHit.type === 'bad-landing') {
          earliest = { type: 'ground', t: checkpointHit.t, alertKey: 'groundCrashAlert', warningKey: 'groundCrashWarning' };
        }
      }

      if (commandBase !== 'land' && commandBase !== 'forced-battery-land') {
        const surfaceY = getValidLandingSurfaceY(from, false, false);
        const groundT = getGroundContactForSegment(from.y, to.y, surfaceY);
        if (groundT !== null) {
          const candidate = { type: 'ground', t: groundT, alertKey: 'groundCrashAlert', warningKey: 'groundCrashWarning' };
          if (!earliest || candidate.t < earliest.t) earliest = candidate;
        }
      }

      if (!earliest) return false;

      const touchPos = from.clone().lerp(to, earliest.t);
      droneStates[droneId].position.copy(touchPos);
      droneStates[droneId].drone.position.copy(touchPos);
      markDroneAsCrashed(droneId);

      await handleCrashSequence({
        crashedIds: [droneId],
        alertKey: earliest.alertKey,
        warningKey: earliest.warningKey,
        finalKey: 'resetRequiredAfterCrash'
      });

      return true;
    }

    async function checkForCollisionAfterMovement(droneId, force = false, commandBase = '', allowStageLanding = false, emergencyLanding = false, strictStageTouchDuringForcedLanding = false) {
      if (force || !isDroneActive(droneId) || isResetPressed) return false;

      const seg = movementFrameContext.currentSegments[droneId];
      if (seg) {
        const directCrash = await detectAndResolveEarliestSingleDroneCrash(
          droneId, seg.from, seg.to, commandBase, allowStageLanding, emergencyLanding, strictStageTouchDuringForcedLanding
        );
        if (directCrash) return true;
      }

      const snapshot = await tryCaptureCollisionSnapshotForCurrentFrame(force);
      if (snapshot) {
        const crashedIds = snapshot.crashedIds || [];
        await handleCrashSequence({
          crashedIds,
          alertKey: 'collisionAlert',
          warningKey: 'collisionWarning',
          finalKey: 'collisionAlert'
        });
        return true;
      }

      return false;
    }

    function getMoveSubsteps(dx, dy, dz) {
      const maxAxis = Math.max(Math.abs(dx), Math.abs(dy), Math.abs(dz));
      return Math.max(1, Math.ceil(maxAxis / SUBSTEP_UNIT));
    }

    function waitWhilePaused(singleDroneId = null, myResetGeneration = resetGeneration) {
      return new Promise(resolve => {
        const loop = () => {
          if (isResetPressed || myResetGeneration !== resetGeneration) {
            resolve(false);
            return;
          }

          const singlePaused = singleDroneId !== null ? droneStates[singleDroneId].isPaused : false;
          const groupPaused = togetherExecutionState.isRunning && togetherExecutionState.isPaused;

          if (!singlePaused && !groupPaused) {
            resolve(true);
            return;
          }

          setTimeout(loop, 20);
        };
        loop();
      });
    }

    async function hoverDrone(droneId, seconds, resetToken = resetGeneration) {
      const durationMs = Math.max(0, seconds * 1000);
      const tick = getHoverTickDelay();
      let elapsed = 0;

      while (elapsed < durationMs) {
        if (isResetPressed || resetToken !== resetGeneration) return;
        const ok = await waitWhilePaused(droneId, resetToken);
        if (!ok) return;
        if (shouldAbortMovementForDrone(droneId)) return;

        beginMovementFrame(droneId, 'hover');
        registerMovementProgress(droneId, 0, 0, 0);
        registerMovementSegment(droneId, droneStates[droneId].position.clone(), droneStates[droneId].position.clone());

        const crashed = await checkForCollisionAfterMovement(droneId, false, 'hover', false, false);
        endMovementFrame(droneId);
        if (crashed) return;

        const dt = Math.min(tick, durationMs - elapsed);
        await new Promise(r => setTimeout(r, dt));
        elapsed += dt;

        const interrupted = await handleBatteryDuringWait(droneId, dt, resetToken);
        if (interrupted) return;
      }
    }

    async function animateWorldMove(droneId, {
      dx = 0, dy = 0, dz = 0,
      pauseAware = true,
      force = false,
      commandBase = '',
      minAllowedY = null,
      resetToken = resetGeneration,
      allowStageLanding = false,
      emergencyLanding = false,
      strictStageTouchDuringForcedLanding = false
    } = {}) {
      const state = droneStates[droneId];
      const totalSubsteps = getMoveSubsteps(dx, dy, dz);
      const sx = dx / totalSubsteps;
      const sy = dy / totalSubsteps;
      const sz = dz / totalSubsteps;

      beginMovementFrame(droneId, 'world');

      for (let i = 0; i < totalSubsteps; i++) {
        if (isResetPressed || resetToken !== resetGeneration) {
          endMovementFrame(droneId);
          return;
        }

        if (!force && state.forceLandingTriggered && !state.forceLandingInProgress) {
          endMovementFrame(droneId);
          return;
        }

        if (pauseAware) {
          const ok = await waitWhilePaused(droneId, resetToken);
          if (!ok) {
            endMovementFrame(droneId);
            return;
          }
        }

        if (!force && shouldAbortMovementForDrone(droneId)) {
          endMovementFrame(droneId);
          return;
        }

        const from = state.position.clone();
        const unclampedTo = from.clone().add(new THREE.Vector3(sx, sy, sz));
        let to = unclampedTo.clone();

        if (commandBase === 'land' || commandBase === 'forced-battery-land') {
          const landingSurfaceY = getValidLandingSurfaceY(to, allowStageLanding, emergencyLanding);
          if (to.y < landingSurfaceY) to.y = landingSurfaceY;
        }

        if (force && minAllowedY !== null && to.y < minAllowedY) to.y = minAllowedY;

        registerMovementProgress(droneId, to.x - from.x, to.y - from.y, to.z - from.z);
        registerMovementSegment(droneId, from, to);

        state.position.copy(to);
        state.drone.position.copy(to);

        const currentSurface = getDroneSurfaceYForCurrentLocation(droneId);
        state.hasTakenOff = state.position.y > currentSurface + 0.01;

        const crashed = await checkForCollisionAfterMovement(
          droneId, force, commandBase, allowStageLanding, emergencyLanding, strictStageTouchDuringForcedLanding
        );
        if (crashed) {
          endMovementFrame(droneId);
          return;
        }

        if (isResetPressed || resetToken !== resetGeneration) {
          endMovementFrame(droneId);
          return;
        }

        const dt = getStepDelay();
        await new Promise(r => setTimeout(r, dt));

        const interrupted = await handleBatteryDuringWait(droneId, dt, resetToken);
        if (interrupted && !state.forceLandingInProgress) {
          endMovementFrame(droneId);
          return;
        }
      }

      endMovementFrame(droneId);
    }

    function animateLocalMove(droneId, { localX = 0, localY = 0, localZ = 0, force = false, commandBase = '', resetToken = resetGeneration, allowStageLanding = false } = {}) {
      const state = droneStates[droneId];
      const worldDelta = new THREE.Vector3(localX, localY, localZ).applyEuler(state.drone.rotation);
      return animateWorldMove(droneId, {
        dx: worldDelta.x,
        dy: worldDelta.y,
        dz: worldDelta.z,
        pauseAware: true,
        force,
        commandBase,
        resetToken,
        allowStageLanding
      });
    }

    function pitchDrone(droneId, direction, distance, resetToken = resetGeneration) {
      const localZ = direction === 'forward' ? -distance : distance;
      return animateLocalMove(droneId, { localZ, commandBase: direction === 'forward' ? 'pitchForward' : 'pitchBackward', resetToken });
    }

    function rollDrone(droneId, direction, distance, resetToken = resetGeneration) {
      const localX = direction === 'left' ? -distance : distance;
      return animateLocalMove(droneId, { localX, commandBase: direction === 'left' ? 'rollLeft' : 'rollRight', resetToken });
    }

    async function throttleDrone(droneId, direction, distance, force = false, commandBaseOverride = null, resetToken = resetGeneration) {
      const state = droneStates[droneId];
      if (state.isThrottling) return;

      state.isThrottling = true;
      const localY = direction === 'up' ? distance : -distance;
      await animateLocalMove(droneId, {
        localY,
        force,
        commandBase: commandBaseOverride || (direction === 'up' ? 'throttleUp' : 'throttleDown'),
        resetToken
      });
      state.isThrottling = false;
    }

    async function yawDrone(droneId, direction, angle, resetToken = resetGeneration) {
      const state = droneStates[droneId];
      if (state.isYawing) return;

      state.isYawing = true;
      const steps = 30;
      const stepDur = (state.yawDuration / steps) / getTimeScale();
      const dA = ((angle * Math.PI / 180) / steps) * (direction === 'left' ? 1 : -1);

      for (let i = 0; i < steps; i++) {
        if (isResetPressed || resetToken !== resetGeneration) {
          state.isYawing = false;
          return;
        }

        if (state.forceLandingTriggered && !state.forceLandingInProgress) {
          state.isYawing = false;
          return;
        }

        const ok = await waitWhilePaused(droneId, resetToken);
        if (!ok) {
          state.isYawing = false;
          return;
        }

        if (shouldAbortMovementForDrone(droneId)) {
          state.isYawing = false;
          return;
        }

        state.drone.rotation.y += dA;
        await new Promise(r => setTimeout(r, stepDur));

        const interrupted = await handleBatteryDuringWait(droneId, stepDur, resetToken);
        if (interrupted && !state.forceLandingInProgress) {
          state.isYawing = false;
          return;
        }
      }

      state.isYawing = false;
    }

    function xyzIncreaseDrone(droneId, dx, dy, dz, resetToken = resetGeneration) {
      return animateWorldMove(droneId, { dx, dy, dz, commandBase: 'xyzIncrease', resetToken });
    }

    async function forceLandDueToLowBattery(droneId, resetToken = resetGeneration) {
      const state = droneStates[droneId];
      if (state.forceLandingInProgress || state.markedAsCrashed || state.isBroken || !state.hasTakenOff) return;

      state.forceLandingInProgress = true;
      state.abortCurrentProgramForBattery = true;
      state.isPaused = false;
      state.isExecuting = true;

      const distance = Math.max(0, state.position.y - startHeight);
      if (distance > 0.01) {
        await animateWorldMove(droneId, {
          dx: 0,
          dy: -distance,
          dz: 0,
          force: false,
          commandBase: 'forced-battery-land',
          minAllowedY: startHeight,
          resetToken,
          allowStageLanding: false,
          emergencyLanding: false,
          strictStageTouchDuringForcedLanding: true
        });
      }

      if (isResetPressed || resetToken !== resetGeneration) {
        state.forceLandingInProgress = false;
        return;
      }

      if (state.markedAsCrashed || state.isBroken) {
        state.forceLandingInProgress = false;
        return;
      }

      enforceDroneRestingSurface(droneId, false, false);
      state.hasTakenOff = false;
      state.isExecuting = false;
      state.isPaused = false;
      state.runCompleted = true;
      state.forceLandingInProgress = false;
      state.abortCurrentProgramForBattery = false;
      clearExecutingLine(droneId);
      updateRunButton(droneId);
      updateDronePanelButtonsDisabledState();
      updateBatteryUI(droneId);
    }

    function strongerCrashEffect(droneId, myResetGeneration = resetGeneration) {
      return new Promise(resolve => {
        const state = droneStates[droneId];
        const originalPos = state.position.clone();
        const originalRot = state.drone.rotation.clone();
        let frame = 0;
        const totalFrames = 12;

        const iv = setInterval(() => {
          if (isResetPressed || myResetGeneration !== resetGeneration) {
            clearInterval(iv);
            resolve();
            return;
          }

          frame++;
          if (frame % 2 === 0) setDroneCrashColor(droneId, 0xff2200);
          else setDroneCrashColor(droneId, 0xffff00);

          const shakeX = (Math.random() - 0.5) * 1.4;
          const shakeY = (Math.random() - 0.5) * 1.0;
          const shakeZ = (Math.random() - 0.5) * 1.4;
          const shakeRotX = (Math.random() - 0.5) * 0.12;
          const shakeRotZ = (Math.random() - 0.5) * 0.12;

          state.drone.position.set(originalPos.x + shakeX, originalPos.y + shakeY, originalPos.z + shakeZ);
          state.drone.rotation.x = originalRot.x + shakeRotX;
          state.drone.rotation.z = originalRot.z + shakeRotZ;

          if (frame >= totalFrames) {
            clearInterval(iv);
            state.position.copy(originalPos);
            state.drone.position.copy(originalPos);
            state.drone.rotation.copy(originalRot);
            setDroneCrashColor(droneId, 0xff1100);
            setTimeout(() => resolve(), 40);
          }
        }, 35 / getTimeScale());
      });
    }

    function getSafeDebrisSpreadVelocity(crashPos) {
      let vx = (Math.random() - 0.5) * (Math.random() * 0.35 + 0.08) * 2;
      let vz = (Math.random() - 0.5) * (Math.random() * 0.35 + 0.08) * 2;

      const supportCp = getSupportingCheckpointAtXZ(crashPos);
      if (!supportCp) return new THREE.Vector3(vx, 0, vz);

      const cp = supportCp;
      const dx = crashPos.x - cp.position.x;
      const dz = crashPos.z - cp.position.z;

      let outward = new THREE.Vector3(dx, 0, dz);
      if (outward.lengthSq() < EPS) {
        const escapeX = cp.width >= cp.depth ? (Math.random() < 0.5 ? -1 : 1) : 0;
        const escapeZ = cp.width < cp.depth ? (Math.random() < 0.5 ? -1 : 1) : 0;
        outward = new THREE.Vector3(escapeX, 0, escapeZ);
        if (outward.lengthSq() < EPS) outward = new THREE.Vector3(1, 0, 0);
      }
      outward.normalize();

      const mag = Math.random() * 0.35 + 0.08;
      vx = outward.x * mag;
      vz = outward.z * mag;
      return new THREE.Vector3(vx, 0, vz);
    }

    function constrainPieceAgainstCheckpointStages(pieceObj) {
      const box = new THREE.Box3().setFromObject(pieceObj.mesh);
      let adjusted = false;

      checkpointsState.items.forEach(cp => {
        const b = getStageBounds(cp);
        const overlapsY = box.max.y > b.baseY && box.min.y < b.topY + 1;
        const overlapsX = box.max.x > b.minX && box.min.x < b.maxX;
        const overlapsZ = box.max.z > b.minZ && box.min.z < b.maxZ;

        if (overlapsX && overlapsY && overlapsZ) {
          const cx = pieceObj.mesh.position.x;
          const cz = pieceObj.mesh.position.z;

          const distLeft = Math.abs(cx - (b.minX - DEBRIS_STAGE_MARGIN));
          const distRight = Math.abs(cx - (b.maxX + DEBRIS_STAGE_MARGIN));
          const distFront = Math.abs(cz - (b.minZ - DEBRIS_STAGE_MARGIN));
          const distBack = Math.abs(cz - (b.maxZ + DEBRIS_STAGE_MARGIN));

          const minDist = Math.min(distLeft, distRight, distFront, distBack);

          if (minDist === distLeft) pieceObj.mesh.position.x = b.minX - DEBRIS_STAGE_MARGIN;
          else if (minDist === distRight) pieceObj.mesh.position.x = b.maxX + DEBRIS_STAGE_MARGIN;
          else if (minDist === distFront) pieceObj.mesh.position.z = b.minZ - DEBRIS_STAGE_MARGIN;
          else pieceObj.mesh.position.z = b.maxZ + DEBRIS_STAGE_MARGIN;

          adjusted = true;
        }
      });

      if (adjusted) {
        pieceObj.velocity.x = 0;
        pieceObj.velocity.z = 0;
        pieceObj.spreadVelocity.x = 0;
        pieceObj.spreadVelocity.z = 0;
      }
    }

    function createBrokenPiecesForDrone(droneId) {
      const state = droneStates[droneId];
      if (state.isBroken || !isDroneActive(droneId)) return;

      state.isBroken = true;
      state.drone.updateMatrixWorld(true);

      state.bodyMeshes.forEach((mesh, index) => {
        const piece = mesh.clone();
        piece.material = mesh.material.clone();

        const pieceWorldPos = new THREE.Vector3();
        const pieceWorldQuat = new THREE.Quaternion();
        const pieceWorldScale = new THREE.Vector3();

        mesh.getWorldPosition(pieceWorldPos);
        mesh.getWorldQuaternion(pieceWorldQuat);
        mesh.getWorldScale(pieceWorldScale);

        piece.position.copy(pieceWorldPos);
        piece.quaternion.copy(pieceWorldQuat);
        piece.scale.copy(pieceWorldScale);

        if (piece.material && piece.material.color) {
          const paletteColor = [0xff0000, 0x0066ff, 0xffff00, 0x111111, 0x00cc66, 0xaa00ff][index % 6];
          piece.material.color.setHex(paletteColor);
        }

        scene.add(piece);

        const outward = new THREE.Vector3(
          (Math.random() - 0.5),
          Math.random() * 0.45 + 0.15,
          (Math.random() - 0.5)
        ).normalize();

        const spreadVelocity = getSafeDebrisSpreadVelocity(state.position);

        state.brokenPieces.push({
          mesh: piece,
          radius: debrisPieceRadius,
          velocity: new THREE.Vector3(
            outward.x * (Math.random() * 0.55 + 0.15),
            -(Math.random() * 0.16 + 0.04),
            outward.z * (Math.random() * 0.55 + 0.15)
          ),
          rotationVelocity: new THREE.Vector3(
            (Math.random() - 0.5) * 0.09,
            (Math.random() - 0.5) * 0.09,
            (Math.random() - 0.5) * 0.09
          ),
          landed: false,
          hasSpread: false,
          spreadVelocity,
          spreadFramesRemaining: Math.floor(Math.random() * 10) + 8
        });
      });

      state.drone.visible = false;
    }

    function breakDronesIntoPiecesSimultaneously(droneIdList) {
      [...new Set(droneIdList)].forEach(id => createBrokenPiecesForDrone(id));
    }

    function clampPieceAboveGround(pieceObj) {
      const box = new THREE.Box3().setFromObject(pieceObj.mesh);
      const penetration = 0 - box.min.y;
      if (penetration > 0) pieceObj.mesh.position.y += penetration;
    }

    function fallBrokenPiecesSimultaneously(droneIdList, myResetGeneration = resetGeneration) {
      return new Promise(resolve => {
        const states = droneIdList
          .filter(id => isDroneActive(id))
          .map(id => droneStates[id])
          .filter(state => state.brokenPieces && state.brokenPieces.length);

        if (!states.length) {
          resolve();
          return;
        }

        const gravity = 0.035;
        const spreadDamping = 0.84;

        const iv = setInterval(() => {
          if (isResetPressed || myResetGeneration !== resetGeneration) {
            clearInterval(iv);
            resolve();
            return;
          }

          let totalPieces = 0;
          let settledPieces = 0;

          states.forEach(state => {
            state.brokenPieces.forEach(piece => {
              totalPieces++;

              if (!piece.landed) {
                piece.velocity.y -= gravity;
                piece.mesh.position.x += piece.velocity.x;
                piece.mesh.position.y += piece.velocity.y;
                piece.mesh.position.z += piece.velocity.z;

                piece.mesh.rotation.x += piece.rotationVelocity.x;
                piece.mesh.rotation.y += piece.rotationVelocity.y;
                piece.mesh.rotation.z += piece.rotationVelocity.z;

                clampPieceAboveGround(piece);
                constrainPieceAgainstCheckpointStages(piece);

                const box = new THREE.Box3().setFromObject(piece.mesh);
                const isTouchingGround = Math.abs(box.min.y) < 0.02;

                if (isTouchingGround && piece.velocity.y <= 0) {
                  piece.velocity.y = 0;
                  clampPieceAboveGround(piece);
                  constrainPieceAgainstCheckpointStages(piece);
                  piece.landed = true;
                }
                return;
              }

              if (piece.landed && !piece.hasSpread) {
                if (piece.spreadFramesRemaining > 0) {
                  piece.mesh.position.x += piece.spreadVelocity.x;
                  piece.mesh.position.z += piece.spreadVelocity.z;
                  piece.mesh.rotation.x += piece.rotationVelocity.x * 0.6;
                  piece.mesh.rotation.y += piece.rotationVelocity.y * 0.6;
                  piece.mesh.rotation.z += piece.rotationVelocity.z * 0.6;

                  piece.spreadVelocity.multiplyScalar(spreadDamping);
                  piece.spreadFramesRemaining--;
                  clampPieceAboveGround(piece);
                  constrainPieceAgainstCheckpointStages(piece);
                } else {
                  piece.hasSpread = true;
                  piece.velocity.set(0, 0, 0);
                  piece.spreadVelocity.set(0, 0, 0);
                  piece.rotationVelocity.set(0, 0, 0);
                  clampPieceAboveGround(piece);
                  constrainPieceAgainstCheckpointStages(piece);
                  settledPieces++;
                }
                return;
              }

              if (piece.hasSpread) {
                clampPieceAboveGround(piece);
                constrainPieceAgainstCheckpointStages(piece);
                settledPieces++;
              }
            });
          });

          if (totalPieces > 0 && settledPieces === totalPieces) {
            clearInterval(iv);
            states.forEach(state => {
              state.brokenPieces.forEach(piece => {
                piece.velocity.set(0, 0, 0);
                piece.spreadVelocity.set(0, 0, 0);
                piece.rotationVelocity.set(0, 0, 0);
                piece.hasSpread = true;
                piece.landed = true;
                clampPieceAboveGround(piece);
                constrainPieceAgainstCheckpointStages(piece);
              });
            });
            resolve();
          }
        }, 20 / getTimeScale());
      });
    }

    async function performLanding(droneId, allowStageLanding, resetToken = resetGeneration) {
      const state = droneStates[droneId];
      const targetY = getValidLandingSurfaceY(state.position, allowStageLanding, false);
      const distance = Math.max(0, state.position.y - targetY);

      if (distance > 0.01) {
        await animateWorldMove(droneId, {
          dx: 0,
          dy: -distance,
          dz: 0,
          force: false,
          commandBase: 'land',
          minAllowedY: targetY,
          resetToken,
          allowStageLanding
        });
      }

      if (isResetPressed || resetToken !== resetGeneration) return;

      enforceDroneRestingSurface(droneId, allowStageLanding, false);
      state.hasTakenOff = false;
      state.forceLandingInProgress = false;
    }

    async function performTakeOff(droneId, resetToken = resetGeneration) {
      const state = droneStates[droneId];
      const currentSurfaceY = getDroneSurfaceYForCurrentLocation(droneId);

      state.position.y = currentSurfaceY;
      state.drone.position.copy(state.position);
      state.hasTakenOff = false;

      await animateWorldMove(droneId, {
        dx: 0,
        dy: 20,
        dz: 0,
        force: false,
        commandBase: 'takeoff',
        minAllowedY: currentSurfaceY,
        resetToken,
        allowStageLanding: false
      });

      if (isResetPressed || resetToken !== resetGeneration) return;
      if (state.forceLandingTriggered) return;
      state.hasTakenOff = true;
    }

    async function executeSingleCommand(droneId, commandObj, resetToken = resetGeneration, allowStageLanding = false) {
      if (isResetPressed || globalCrashSequenceActive || !isDroneActive(droneId) || resetToken !== resetGeneration) return;

      const state = droneStates[droneId];
      if (state.forceLandingTriggered && !state.forceLandingInProgress) return;
      if (state.requiresResetAfterCrash || state.mustAmendCodeAfterCrash || state.forceLandingInProgress || state.abortCurrentProgramForBattery) return;

      setExecutingLine(droneId, commandObj.lineIndex);

      const command = commandObj.text;
      const parts = command.trim().split(/\s+/);
      const base = parts[0].toLowerCase();
      const param = parts[1] ? parseFloat(parts[1]) : null;

      if (base === 'takeoff') {
        await performTakeOff(droneId, resetToken);
        return;
      }

      if (base === 'land') {
        await performLanding(droneId, allowStageLanding, resetToken);
        return;
      }

      if (base === 'hover') {
        let hoverToken = (parts[1] || '').toLowerCase();
        if (hoverToken.endsWith('s')) hoverToken = hoverToken.slice(0, -1);
        const seconds = parseFloat(hoverToken);
        if (!isNaN(seconds) && seconds > 0) await hoverDrone(droneId, seconds, resetToken);
        return;
      }

      if (base === 'xyzincrease') {
        const x = parseFloat(parts[1]);
        const y = parseFloat(parts[2]);
        const z = parseFloat(parts[3]);
        const delta = getXYZWorldDelta(droneId, x, y, z);
        await xyzIncreaseDrone(droneId, delta.worldX, delta.worldY, delta.worldZ, resetToken);
        return;
      }

      switch (base) {
        case 'pitchforward':
        case 'pitchbackward':
        case 'rollleft':
        case 'rollright':
        case 'throttleup':
        case 'throttledown':
        case 'yawleft':
        case 'yawright':
          if (param !== null) {
            const match = base.match(/(pitch|roll|throttle|yaw)(left|right|forward|backward|up|down)?/);
            if (match) {
              const action = match[1];
              const direction = match[2];
              if (action === 'pitch') await pitchDrone(droneId, direction, param, resetToken);
              else if (action === 'roll') await rollDrone(droneId, direction, param, resetToken);
              else if (action === 'throttle') await throttleDrone(droneId, direction, param, false, null, resetToken);
              else if (action === 'yaw') await yawDrone(droneId, direction, param, resetToken);
            }
          }
          break;
      }
    }

    async function runCodeForDrone(droneId) {
      if (togetherExecutionState.isRunning || globalCrashSequenceActive || !isDroneActive(droneId)) return;

      const myResetGeneration = resetGeneration;
      setActiveCodeBox(droneId);
      const state = droneStates[droneId];
      const codeInput = getCanonicalCodeInput(droneId);
      storeCurrentCodes();

      if (state.requiresResetAfterCrash || state.runCompleted) {
        resetDroneAfterCrash(droneId);
        return;
      }

      if (state.mustAmendCodeAfterCrash) {
        alert(translations[currentLanguage].mustAmendCodeAfterCrash);
        return;
      }

      if (state.isExecuting) {
        state.isPaused = !state.isPaused;
        updateRunButton(droneId);
        return;
      }

      resetDroneState(droneId, true);

      const parsed = parseCode(storedCodeValues[droneId] || '');
      const flat = executeCommands(parsed);

      if (
        flat.length < 2 ||
        flat[0].text.trim().toLowerCase() !== 'takeoff' ||
        flat[flat.length - 1].text.trim().toLowerCase() !== 'land'
      ) {
        alert(`${translations[currentLanguage][`drone${droneId}Label`]}: ` + translations[currentLanguage].invalidCodeStructure);
        return;
      }

      collisionDetected = false;
      collisionHandling = false;
      clearMessage();

      state.isExecuting = true;
      state.isPaused = false;
      state.runCompleted = false;
      state.abortCurrentProgramForBattery = false;
      updateRunButton(droneId);
      updateDronePanelButtonsDisabledState();

      for (let i = 0; i < flat.length; i++) {
        const cmdObj = flat[i];

        if (isResetPressed || globalCrashSequenceActive || myResetGeneration !== resetGeneration) break;

        if (state.forceLandingTriggered && !state.forceLandingInProgress && !state.lowBatteryLandingHandled) {
          state.lowBatteryLandingHandled = true;
          setMessageByKey('lowBatteryForcedLanding', { blink: true, colorChange: true });
          await forceLandDueToLowBattery(droneId, myResetGeneration);
          break;
        }

        const ok = await waitWhilePaused(droneId, myResetGeneration);
        if (!ok) break;

        if (state.forceLandingTriggered && !state.forceLandingInProgress && !state.lowBatteryLandingHandled) {
          state.lowBatteryLandingHandled = true;
          setMessageByKey('lowBatteryForcedLanding', { blink: true, colorChange: true });
          await forceLandDueToLowBattery(droneId, myResetGeneration);
          break;
        }

        if (state.abortCurrentProgramForBattery && !state.forceLandingInProgress) break;
        if (state.markedAsCrashed || state.isBroken || state.requiresResetAfterCrash || state.mustAmendCodeAfterCrash || state.forceLandingInProgress) break;

        const isLand = cmdObj.text.trim().toLowerCase() === 'land';
        const allowStageLanding = isLand && isStageLandingFinal(flat, i);

        await executeSingleCommand(droneId, cmdObj, myResetGeneration, allowStageLanding);

        if (state.forceLandingTriggered && !state.forceLandingInProgress && !state.markedAsCrashed && !state.isBroken && !state.lowBatteryLandingHandled) {
          state.lowBatteryLandingHandled = true;
          setMessageByKey('lowBatteryForcedLanding', { blink: true, colorChange: true });
          await forceLandDueToLowBattery(droneId, myResetGeneration);
          break;
        }

        if (isResetPressed || myResetGeneration !== resetGeneration) break;
        if (state.abortCurrentProgramForBattery && !state.forceLandingInProgress) break;
        if (state.markedAsCrashed || state.isBroken || state.requiresResetAfterCrash || state.mustAmendCodeAfterCrash || globalCrashSequenceActive || state.forceLandingInProgress) break;
      }

      if (myResetGeneration === resetGeneration) {
        if (!state.requiresResetAfterCrash && !state.mustAmendCodeAfterCrash && !state.markedAsCrashed && !state.isBroken && !globalCrashSequenceActive && !isResetPressed) {
          if (state.abortCurrentProgramForBattery && !state.forceLandingInProgress) {
            state.isExecuting = false;
            state.isPaused = false;
          } else if (!state.forceLandingTriggered || !state.hasTakenOff) {
            state.runCompleted = true;
          }
        }

        state.isExecuting = false;
        state.isPaused = false;
        state.abortCurrentProgramForBattery = false;
        if (!state.requiresResetAfterCrash) clearExecutingLine(droneId);
        updateRunButton(droneId);
        updateDronePanelButtonsDisabledState();
        setActiveCodeBox(droneId);
      }
    }

    async function runTogetherToggle() {
      if (globalCrashSequenceActive) return;

      if (togetherExecutionState.isRunning) {
        togetherExecutionState.isPaused = !togetherExecutionState.isPaused;
        droneIds.forEach(id => {
          if (droneStates[id].isExecuting) droneStates[id].isPaused = togetherExecutionState.isPaused;
        });
        updateRunButtons();
        updateRunTogetherButton();
        updateDronePanelButtonsDisabledState();
        return;
      }

      runTogether();
    }

    async function runTogether() {
      if (droneIds.some(id => droneStates[id].isExecuting) || globalCrashSequenceActive) return;
      const myResetGeneration = resetGeneration;
      storeCurrentCodes();

      const participatingDroneIds = droneIds.filter(isDroneActive);

      const blockedDrone = participatingDroneIds.find(id => droneStates[id].requiresResetAfterCrash || droneStates[id].mustAmendCodeAfterCrash);
      if (blockedDrone) {
        const key = droneStates[blockedDrone].requiresResetAfterCrash ? 'resetRequiredAfterCrash' : 'mustAmendCodeAfterCrash';
        alert(`${translations[currentLanguage][`drone${blockedDrone}Label`]}: ` + translations[currentLanguage][key]);
        return;
      }

      collisionDetected = false;
      collisionHandling = false;
      clearMessage();

      togetherExecutionState.isRunning = true;
      togetherExecutionState.isPaused = false;
      updateRunTogetherButton();
      updateDronePanelButtonsDisabledState();

      participatingDroneIds.forEach(id => resetDroneState(id, true));
      droneIds.filter(id => !isDroneActive(id)).forEach(id => removePreviewPathForDrone(id));

      const allCommands = {};
      const participatingIds = [];

      for (const id of participatingDroneIds) {
        storeCurrentCodes();
        const code = (storedCodeValues[id] || '').trim();

        if (!code) {
          removePreviewPathForDrone(id);
          continue;
        }

        const flat = executeCommands(parseCode(code));
        if (!flat.length) {
          removePreviewPathForDrone(id);
          continue;
        }

        if (
          flat.length < 2 ||
          flat[0].text.trim().toLowerCase() !== 'takeoff' ||
          flat[flat.length - 1].text.trim().toLowerCase() !== 'land'
        ) {
          alert(`${translations[currentLanguage][`drone${id}Label`]}: ` + translations[currentLanguage].invalidCodeStructure);
          togetherExecutionState.isRunning = false;
          togetherExecutionState.isPaused = false;
          updateRunButtons();
          updateRunTogetherButton();
          updateDronePanelButtonsDisabledState();
          return;
        }

        allCommands[id] = flat;
        participatingIds.push(id);
      }

      if (participatingIds.length === 0) {
        togetherExecutionState.isRunning = false;
        togetherExecutionState.isPaused = false;
        updateRunButtons();
        updateRunTogetherButton();
        updateDronePanelButtonsDisabledState();
        return;
      }

      if (allPreviewVisible) {
        participatingIds.forEach(id => {
          const pts = getPreviewPointsForDrone(id);
          droneStates[id].previewPoints = pts;
          if (pts.length >= 2) {
            removePreviewPathForDrone(id);
            const line = createDottedLineFromPoints(pts, droneStates[id].color);
            droneStates[id].pathLine = line;
            droneStates[id].pathLine.visible = true;
            droneStates[id].pathLineBlinkState = true;
            droneStates[id].lastPathBlinkToggle = Date.now();
            scene.add(line);
          }
        });
      }

      participatingIds.forEach(id => {
        droneStates[id].isExecuting = true;
        droneStates[id].isPaused = false;
        droneStates[id].runCompleted = false;
        droneStates[id].abortCurrentProgramForBattery = false;
      });
      updateRunButtons();
      updateDronePanelButtonsDisabledState();

      const maxLen = Math.max(...participatingIds.map(id => allCommands[id].length));

      for (let i = 0; i < maxLen; i++) {
        if (isResetPressed || globalCrashSequenceActive || myResetGeneration !== resetGeneration) break;

        const lowBatteryIds = participatingIds.filter(id =>
          droneStates[id].forceLandingTriggered &&
          !droneStates[id].forceLandingInProgress &&
          !droneStates[id].markedAsCrashed &&
          !droneStates[id].isBroken &&
          droneStates[id].hasTakenOff &&
          !droneStates[id].lowBatteryLandingHandled
        );

        if (lowBatteryIds.length) {
          lowBatteryIds.forEach(id => droneStates[id].lowBatteryLandingHandled = true);
          setMessageByKey('lowBatteryForcedLanding', { blink: true, colorChange: true });
          await Promise.all(lowBatteryIds.map(id => forceLandDueToLowBattery(id, myResetGeneration)));
        }

        const ok = await waitWhilePaused(null, myResetGeneration);
        if (!ok) break;

        if (collisionDetected || globalCrashSequenceActive || myResetGeneration !== resetGeneration) break;

        const tasks = [];
        participatingIds.forEach(id => {
          if (droneStates[id].forceLandingTriggered && !droneStates[id].forceLandingInProgress) return;
          if (droneStates[id].abortCurrentProgramForBattery && !droneStates[id].forceLandingInProgress) return;
          if (droneStates[id].markedAsCrashed || droneStates[id].isBroken || droneStates[id].forceLandingInProgress) return;
          if (i < allCommands[id].length) {
            const cmdObj = allCommands[id][i];
            const isLand = cmdObj.text.trim().toLowerCase() === 'land';
            const allowStageLanding = isLand && isStageLandingFinal(allCommands[id], i);
            tasks.push(executeSingleCommand(id, cmdObj, myResetGeneration, allowStageLanding));
          }
        });

        await Promise.all(tasks);

        const newLowBatteryIds = participatingIds.filter(id =>
          droneStates[id].forceLandingTriggered &&
          !droneStates[id].forceLandingInProgress &&
          !droneStates[id].markedAsCrashed &&
          !droneStates[id].isBroken &&
          droneStates[id].hasTakenOff &&
          !droneStates[id].lowBatteryLandingHandled
        );

        if (newLowBatteryIds.length) {
          newLowBatteryIds.forEach(id => droneStates[id].lowBatteryLandingHandled = true);
          setMessageByKey('lowBatteryForcedLanding', { blink: true, colorChange: true });
          await Promise.all(newLowBatteryIds.map(id => forceLandDueToLowBattery(id, myResetGeneration)));
        }

        if (isResetPressed || myResetGeneration !== resetGeneration) break;
        if (collisionDetected || globalCrashSequenceActive) break;

        const groups = detectAllCollisionGroupsFromCurrentPositions(participatingIds);
        if (groups.length) {
          const crashedIds = getAllCrashedIdsFromGroups(groups);
          crashedIds.forEach(id => droneStates[id].markedAsCrashed = true);
          resolveCollisionPositionsAtTouch(crashedIds);
          triggerCollision();

          await handleCrashSequence({
            crashedIds,
            alertKey: 'collisionAlert',
            warningKey: 'collisionWarning',
            finalKey: 'collisionAlert'
          });
          break;
        }
      }

      if (myResetGeneration === resetGeneration) {
        participatingIds.forEach(id => {
          if (!droneStates[id].requiresResetAfterCrash && !droneStates[id].mustAmendCodeAfterCrash && !droneStates[id].markedAsCrashed && !droneStates[id].isBroken) {
            droneStates[id].isExecuting = false;
            droneStates[id].isPaused = false;
            droneStates[id].abortCurrentProgramForBattery = false;
            clearExecutingLine(id);
            if (!droneStates[id].hasTakenOff || droneStates[id].forceLandingTriggered) droneStates[id].runCompleted = true;
          }
        });

        togetherExecutionState.isRunning = false;
        togetherExecutionState.isPaused = false;
        updateRunButtons();
        updateRunTogetherButton();
        updateDronePanelButtonsDisabledState();

        if (!document.querySelector(`#code-input-${activeCodeBox}`)) activeCodeBox = 1;
      }
    }

    function rebuildGridForBounds(points) {
      const allPoints = points && points.length ? points.slice() : [];
      allPoints.push(
        new THREE.Vector3(-baseGroundSize / 2, 0, -baseGroundSize / 2),
        new THREE.Vector3(baseGroundSize / 2, 0, baseGroundSize / 2)
      );

      const box = new THREE.Box3().setFromPoints(allPoints);
      const size = box.getSize(new THREE.Vector3());
      const maxHorizontal = Math.max(size.x, size.z, baseGroundSize);
      const gridSize = Math.ceil((maxHorizontal + 120) / 20) * 20;
      const divisions = Math.max(20, Math.min(220, Math.round(gridSize / 10)));

      if (gridHelper) scene.remove(gridHelper);
      gridHelper = new THREE.GridHelper(gridSize, divisions, 0x999999, 0xcccccc);
      gridHelper.position.set(0, 0, 0);
      scene.add(gridHelper);
    }

    function getPreviewPointsForDrone(droneId) {
      const state = droneStates[droneId];
      storeCurrentCodes();
const code = (storedCodeValues[droneId] || '').trim();
      if (!code || !isDroneActive(droneId)) return [];

      const parsed = parseCode(code);
      const flat = executeCommands(parsed);
      if (!flat.length) return [];

      let pos = state.defaultPosition.clone();
      let rotY = state.defaultRotation.y;
      const pts = [state.defaultPosition.clone()];

      flat.forEach((c, index) => {
        const parts = c.text.trim().split(/\s+/);
        const b = parts[0].toLowerCase();
        const p = parts[1] ? parseFloat(parts[1]) : null;

        if (b === 'takeoff') {
          const surfaceY = getDroneSurfaceYForPosition(pos);
          pos.y = surfaceY + 20;
          pts.push(pos.clone());
          return;
        }

        if (b === 'land') {
          const allowStageLanding = index === flat.length - 1;
          pos.y = getValidLandingSurfaceY(pos, allowStageLanding, false);
          pts.push(pos.clone());
          return;
        }

        if (b === 'hover') {
          pts.push(pos.clone());
          return;
        }

        if (b === 'xyzincrease') {
          const x = parseFloat(parts[1]);
          const y = parseFloat(parts[2]);
          const z = parseFloat(parts[3]);
          const delta = getXYZWorldDelta(droneId, x, y, z);
          const nextPos = pos.clone().add(new THREE.Vector3(delta.worldX, delta.worldY, delta.worldZ));
          pts.push(nextPos.clone());
          pos.copy(nextPos);
          return;
        }

        if (p === null) return;

        if (b === 'throttleup') { pos.y += p; pts.push(pos.clone()); return; }
        if (b === 'throttledown') { pos.y -= p; pts.push(pos.clone()); return; }
        if (b === 'yawleft') { rotY += THREE.MathUtils.degToRad(p); return; }
        if (b === 'yawright') { rotY -= THREE.MathUtils.degToRad(p); return; }

        if (b === 'pitchforward' || b === 'pitchbackward') {
          const localZ = b === 'pitchforward' ? -p : p;
          const vec = new THREE.Vector3(0, 0, localZ).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY);
          pos.add(vec);
          pts.push(pos.clone());
          return;
        }

        if (b === 'rollleft' || b === 'rollright') {
          const localX = b === 'rollleft' ? -p : p;
          const vec = new THREE.Vector3(localX, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY);
          pos.add(vec);
          pts.push(pos.clone());
        }
      });

      return pts;
    }

    function createDottedLineFromPoints(points, colorHex) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      geometry.computeBoundingSphere();

      const material = new THREE.LineDashedMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.5,
        dashSize: 4,
        gapSize: 3,
        linewidth: 1
      });

      const line = new THREE.Line(geometry, material);
      line.computeLineDistances();
      return line;
    }

function getCombinedPreviewPointsFromVisiblePathsOrDefaults() {
  const combinedPoints = [];
  storeCurrentCodes();

  droneIds.forEach(id => {
    if (!isDroneActive(id)) return;
    const code = (storedCodeValues[id] || '').trim();
    if (!code) return;

    const s = droneStates[id];
    if (s.pathLine && s.previewPoints && s.previewPoints.length) {
      combinedPoints.push(...s.previewPoints.map(p => p.clone()));
    } else {
      const pts = getPreviewPointsForDrone(id);
      if (pts.length) combinedPoints.push(...pts);
    }
  });

  checkpointsState.items.forEach(cp => {
    combinedPoints.push(new THREE.Vector3(cp.position.x, cp.height + 20, cp.position.z));
  });

  return combinedPoints;
}

function drawPreviewPathForDrone(droneId) {
  const state = droneStates[droneId];

  if (state.pathLine) {
    scene.remove(state.pathLine);
    state.pathLine = null;
  }

  storeCurrentCodes();
  const code = (storedCodeValues[droneId] || '').trim();
  if (!code || !isDroneActive(droneId)) return false;

  const pts = getPreviewPointsForDrone(droneId);
  if (pts.length < 2) return false;

  state.previewPoints = pts.map(p => p.clone());
  state.pathLine = createDottedLineFromPoints(pts, state.color);
  state.pathLine.visible = true;
  state.pathLineBlinkState = true;
  state.lastPathBlinkToggle = Date.now();
  scene.add(state.pathLine);
  return true;
}

    function previewPathForDrone(droneId) {
      if (globalCrashSequenceActive || !isDroneActive(droneId)) return;

      const state = droneStates[droneId];
      if (state.requiresResetAfterCrash || state.mustAmendCodeAfterCrash) return;
      if (togetherExecutionState.isRunning) return;

      setActiveCodeBox(droneId);

      storeCurrentCodes();
const code = (storedCodeValues[droneId] || '').trim();
      if (!code) {
        removePreviewPathForDrone(droneId);
        state.previewPoints = [];
        renderer.render(scene, camera);
        return;
      }

      if (state.pathLine) {
        scene.remove(state.pathLine);
        state.pathLine = null;
        state.previewPoints = [];
        renderer.render(scene, camera);
        return;
      }

      const ok = drawPreviewPathForDrone(droneId);
      if (!ok) {
        alert(translations[currentLanguage].noValidCommands);
        return;
      }

      const combinedPoints = getCombinedPreviewPointsFromVisiblePathsOrDefaults();
      rebuildGridForBounds(combinedPoints);
      renderer.render(scene, camera);
    }

    function allPathPreview() {
      if (globalCrashSequenceActive) return;

      const blockedDrone = droneIds.filter(isDroneActive).find(id => droneStates[id].requiresResetAfterCrash || droneStates[id].mustAmendCodeAfterCrash);
      if (blockedDrone) return;

      if (allPreviewVisible) {
        droneIds.forEach(id => {
          removePreviewPathForDrone(id);
          droneStates[id].previewPoints = [];
        });
        allPreviewVisible = false;
        renderer.render(scene, camera);
        return;
      }

      let anyValid = false;
      const combinedPoints = [];

      droneIds.forEach(id => {
        if (!isDroneActive(id)) return;

        storeCurrentCodes();
const code = (storedCodeValues[id] || '').trim();
        removePreviewPathForDrone(id);
        droneStates[id].previewPoints = [];

        if (!code) return;

        const ok = drawPreviewPathForDrone(id);
        if (ok) {
          anyValid = true;
          combinedPoints.push(...droneStates[id].previewPoints.map(p => p.clone()));
        }
      });

      checkpointsState.items.forEach(cp => {
        combinedPoints.push(new THREE.Vector3(cp.position.x, cp.height + 20, cp.position.z));
      });

      if (!anyValid) {
        alert(translations[currentLanguage].noValidCommands);
        return;
      }

      rebuildGridForBounds(combinedPoints);
      allPreviewVisible = true;
      renderer.render(scene, camera);
    }

    function updateDroneAndPadLayout(regenerateCheckpointPositions = false) {
      const config = getDroneConfigPositions(activeDroneCount);

      droneIds.forEach(id => {
        const state = droneStates[id];
        const entry = config[id];

        if (entry) {
          state.defaultPosition = entry.position.clone();
          state.defaultRotation = new THREE.Euler(0, entry.rotationY, 0, 'XYZ');
          state.position = entry.position.clone();
          state.drone.position.copy(entry.position);
          state.drone.rotation.copy(state.defaultRotation);
          state.drone.visible = true;
          if (state.pathLine) {
            scene.remove(state.pathLine);
            state.pathLine = null;
          }
          state.previewPoints = [];
        } else {
          state.position = new THREE.Vector3(99999, 99999, 99999);
          state.drone.position.copy(state.position);
          state.drone.visible = false;
          if (state.pathLine) {
            scene.remove(state.pathLine);
            state.pathLine = null;
          }
          state.previewPoints = [];
        }
      });

      rebuildLandingPads();
      updateDroneLabels();

      if (checkpointsState.visible && checkpointsState.mode) {
        const mode = checkpointsState.mode;
        const preserve = !regenerateCheckpointPositions;
        clearCheckpointObjects();
        generateCheckpoints(mode, preserve);
      } else clearCheckpointObjects();
    }

    function getAllDroneCenter() {
      const activeStates = droneIds.filter(isDroneActive).map(id => droneStates[id]);
      const center = new THREE.Vector3();
      if (!activeStates.length) return center;
      activeStates.forEach(state => center.add(state.defaultPosition));
      center.multiplyScalar(1 / activeStates.length);
      return center;
    }

    function rotateView(direction) {
      const center = getAllDroneCenter();
      const angle = direction === 'left' ? Math.PI / 18 : -Math.PI / 18;
      const cameraPos = camera.position.clone().sub(center);
      cameraPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), angle);
      camera.position.copy(center).add(cameraPos);
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    }

    function moveViewUp() {
      camera.position.y += 10;
      controls.update();
    }

    function moveViewDown() {
      if (camera.position.y > 10) {
        camera.position.y -= 10;
        controls.update();
      }
    }

    function zoom(direction) {
      const center = getAllDroneCenter();
      const factor = direction === 'in' ? 0.9 : 1.1;
      const cameraPos = camera.position.clone().sub(center).multiplyScalar(factor);
      camera.position.copy(center).add(cameraPos);
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    }

    function centreView() {
      const center = getAllDroneCenter();
      camera.position.set(center.x + 260, center.y + 190, center.z + 260);
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    }

function storeCurrentCodes() {
  droneIds.forEach(id => {
    const inputs = getAllCodeInputsForDrone(id);

    if (!inputs.length) {
      if (typeof storedCodeValues[id] !== 'string') storedCodeValues[id] = '';
      return;
    }

    // If any rendered textarea for this drone has focus, trust it first
    const focused = inputs.find(el => el === document.activeElement);
    if (focused) {
      storedCodeValues[id] = focused.value || '';
      return;
    }

    // Otherwise prefer the longest value, because stale rebuilt textareas
    // are often empty while the live one contains the real code.
    let bestValue = storedCodeValues[id] || '';
    inputs.forEach(el => {
      const v = el.value || '';
      if (v.length > bestValue.length) bestValue = v;
    });

    storedCodeValues[id] = bestValue;
  });
}

function syncStoredCodeToAllInputs(droneId) {
  const value = storedCodeValues[droneId] || '';
  getAllCodeInputsForDrone(droneId).forEach(el => {
    if (el.value !== value) el.value = value;
  });
  syncCodeOverlay(droneId);
}

function setStoredCodeValue(droneId, value) {
  storedCodeValues[droneId] = typeof value === 'string' ? value : '';
  syncStoredCodeToAllInputs(droneId);
}

function buildSliderOrder() {

  if (activeIds.length <= 1) {
    sliderOrder = [1];

}

droneIds.forEach(id => {

    function getVisibleLogicalIndex() {
      if (activeDroneCount <= 2) return 0;
      return ((logicalIndex - 1) % activeDroneCount) + 1;
    }

    function updateDots() {
      const idx = getVisibleLogicalIndex() - 1;
      document.querySelectorAll('.page-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === idx);
      });
    }

    function updateSliderPosition(animate = true) {
      const win = document.getElementById('carousel-window');
      const track = document.getElementById('carousel-track');
      if (!win || !track) return;

      track.style.transition = animate ? 'transform 0.38s ease' : 'none';

      const slidesPerView = window.innerWidth <= 1100 ? 1 : 2;
      slideWidth = win.clientWidth / slidesPerView;

      if (activeDroneCount === 1 || activeDroneCount === 2) {
        logicalIndex = 0;
        track.style.transform = 'translateX(0px)';
        updateDots();
        return;
      }

      track.style.transform = `translateX(${-logicalIndex * slideWidth}px)`;
      updateDots();
    }

    function normalizeSliderPosition() {
      if (activeDroneCount <= 2) {
        logicalIndex = 0;
        updateSliderPosition(false);
        return;
      }

      if (logicalIndex === 0) {
        logicalIndex = activeDroneCount;
        updateSliderPosition(false);
      } else if (logicalIndex === activeDroneCount + 1) {
        logicalIndex = 1;
        updateSliderPosition(false);
      }
      updateDots();
    }

    function initCarousel() {
      renderCarouselSlides();

      const win = document.getElementById('carousel-window');
      const track = document.getElementById('carousel-track');

      updateSliderPosition(false);
      track.addEventListener('transitionend', normalizeSliderPosition);

      const startDrag = clientX => {
        if (globalCrashSequenceActive || activeDroneCount <= 2) return;
        isDraggingCarousel = true;
        dragStartX = clientX;
        dragCurrentX = clientX;
        win.classList.add('dragging');
        track.style.transition = 'none';
      };

      const moveDrag = clientX => {
        if (!isDraggingCarousel || activeDroneCount <= 2) return;
        dragCurrentX = clientX;
        const dx = dragCurrentX - dragStartX;
        track.style.transform = `translateX(${(-logicalIndex * slideWidth) + dx}px)`;
      };

      const endDrag = () => {
        if (!isDraggingCarousel) return;
        const dx = dragCurrentX - dragStartX;
        const threshold = slideWidth * 0.18;

        isDraggingCarousel = false;
        win.classList.remove('dragging');

        if (activeDroneCount > 2) {
          if (dx < -threshold) logicalIndex += 1;
          else if (dx > threshold) logicalIndex -= 1;
        }

        updateSliderPosition(true);
      };

      win.addEventListener('mousedown', e => {
        if (e.target.tagName === 'TEXTAREA') return;
        startDrag(e.clientX);
      });

      window.addEventListener('mousemove', e => moveDrag(e.clientX));
      window.addEventListener('mouseup', endDrag);

      win.addEventListener('touchstart', e => {
        if (e.target.tagName === 'TEXTAREA') return;
        if (e.touches.length) startDrag(e.touches[0].clientX);
      }, { passive: true });

      win.addEventListener('touchmove', e => {
        if (e.touches.length) moveDrag(e.touches[0].clientX);
      }, { passive: true });

      win.addEventListener('touchend', endDrag);
    }

    function populateTutorial() {

        case 6: html = `<h3>${c.tutorialStep6Title}</h3><p>${c.tutorialStep6Content.replace(/\n/g, '<br>')}</p>`; break;
        case 7: html = `<h3>${c.tutorialStep7Title}</h3><p>${c.tutorialStep7Content.replace(/\n/g, '<br>')}</p>`; break;
        case 8: html = `<h3>${c.tutorialStep8Title}</h3><p>${c.tutorialStep8Content.replace(/\n/g, '<br>')}</p>`; break;
        case 9: html = `<h3>${c.tutorialStep9Title}</h3><p>${c.tutorialStep9Content.replace(/\n/g, '<br>')}</p>`; break;
      }

      tutorialContent.innerHTML = html;
      document.getElementById('prev-button').style.display = currentStep === 1 ? 'none' : 'inline-block';
      document.getElementById('next-button').style.display = currentStep === totalSteps ? 'none' : 'inline-block';
    }

    window.onclick = function(e) {
      if (e.target === tutorialModal) closeTutorial();
    };

    initCarousel();
    initGame();
updateLanguage();
updateRunButtons();
updateRunTogetherButton();
updateDroneTitleColors();
updateDronePanelButtonsDisabledState();
updateCheckpointSelectUI();
updateDroneCountSelectUI();
updateTunnelToggleUI();
updateSlowMotionButtonUI();
updateSingleDroneCarouselUI();
syncAllCodeOverlays();
updateAllBatteryUI();
updateProjectMenuUI();

    window.setDroneCount = setDroneCount;
    window.handleDroneCountSelectChange = handleDroneCountSelectChange;
    window.handleCheckpointSelectChange = handleCheckpointSelectChange;
    window.handleTunnelToggleChange = handleTunnelToggleChange;


window.toggleProjectMenu = toggleProjectMenu;
window.saveProjectSlot = saveProjectSlot;
window.loadProjectSlot = loadProjectSlot;
window.handleProjectSlotRightClick = handleProjectSlotRightClick;

      resizeRendererToContainer();
      updateSliderPosition(false);
      if (renderer && camera) renderer.render(scene, camera);
    });


const projectMenuEl = document.getElementById('project-menu');
if (projectMenuEl) {

    event.stopPropagation();

document.addEventListener('click', () => {

});
